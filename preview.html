<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LinkTree Pro — Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- YouTube Iframe API untuk musik full duration -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; transition: all 0.3s; }
        body.light-mode { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        body.dark-mode { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); color: #e0e0e0; }
        body.custom-bg { background: var(--custom-bg) !important; background-size: cover !important; background-position: center !important; background-attachment: fixed !important; }
        
        .navbar { background: rgba(0,0,0,0.4); backdrop-filter: blur(12px); padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 24px; font-weight: 800; cursor: pointer; }
        .logo i { color: #1DB954; margin-right: 8px; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 8px 20px; border-radius: 40px; cursor: pointer; transition: 0.2s; }
        .btn-outline:hover { background: rgba(255,255,255,0.2); }
        
        .main-container { max-width: 550px; margin: 40px auto; padding: 0 20px; }
        .profile-card { background: rgba(0,0,0,0.3); backdrop-filter: blur(12px); border-radius: 48px; padding: 32px 24px; border: 1px solid rgba(255,255,255,0.15); transition: all 0.3s; }
        .preview-avatar { width: 120px; height: 120px; border-radius: 60px; background: rgba(255,255,255,0.2); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preview-avatar i { font-size: 60px; }
        .preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .preview-name { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .preview-bio { text-align: center; font-size: 14px; opacity: 0.8; margin-bottom: 30px; }
        .preview-link { background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); border-radius: 60px; padding: 14px 24px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: white; transition: 0.2s; cursor: pointer; }
        .preview-link:hover { transform: translateX(5px); background: rgba(255,255,255,0.2); }
        .preview-link-left { display: flex; gap: 15px; align-items: center; font-weight: 500; }
        .copy-link-btn { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .copy-link-btn:hover { opacity: 1; }
        .music-embed { margin-top: 25px; border-radius: 24px; overflow: hidden; }
        .footer { text-align: center; font-size: 11px; opacity: 0.5; margin-top: 40px; padding: 20px; }
        .loading-spinner { border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 60px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-card { text-align: center; padding: 60px 20px; background: rgba(0,0,0,0.3); border-radius: 48px; }
        .error-card i { font-size: 48px; margin-bottom: 20px; color: #ff8888; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .last-updated { font-size: 11px; opacity: 0.6; }
        .theme-toggle-preview { cursor: pointer; padding: 6px 12px; border-radius: 30px; background: rgba(255,255,255,0.1); font-size: 12px; }
        .visitor-count { font-size: 11px; opacity: 0.6; }
        .copy-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1DB954; padding: 8px 16px; border-radius: 40px; font-size: 12px; animation: fadeOut 2s ease; z-index: 1000; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" id="homeLogo"><i class="fas fa-link"></i> Link<span style="background:linear-gradient(135deg,#A855F7,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent;">Pro</span></div>
            <div style="display: flex; gap: 12px;">
                <button id="themeTogglePreview" class="btn-outline" style="padding: 6px 15px;"><i class="fas fa-moon"></i> Mode</button>
                <button id="backBtn" class="btn-outline" style="padding: 6px 15px;"><i class="fas fa-arrow-left"></i> Beranda</button>
            </div>
        </div>
    </nav>
    <div class="main-container" id="mainContainer">
        <div class="loading-spinner"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD10-8FaZa_gO_2-QBs0HLvpqWEIjC30oE",
            authDomain: "linktree-xtxz.firebaseapp.com",
            databaseURL: "https://linktree-xtxz-default-rtdb.firebaseio.com",
            projectId: "linktree-xtxz",
            storageBucket: "linktree-xtxz.firebasestorage.app",
            messagingSenderId: "551602488147",
            appId: "1:551602488147:web:67fa5a814a9fb2a688d7a6"
        };
        
        let database;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        } catch(e) { console.error(e); }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        
        let currentTheme = 'light';
        
        function applyTheme(user) {
            let theme = user?.theme || 'light';
            let bg = user?.bgImage || '';
            if (bg) {
                document.body.style.setProperty('--custom-bg', `url('${bg}')`);
                document.body.className = 'custom-bg';
            } else {
                document.body.className = currentTheme === 'dark' ? 'dark-mode' : 'light-mode';
                document.body.style.removeProperty('--custom-bg');
            }
        }
        
        function applyCustomCSS(css) {
            let styleEl = document.getElementById('customPreviewCSS');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'customPreviewCSS';
                document.head.appendChild(styleEl);
            }
            styleEl.textContent = css || '';
        }

        let musicPlayer = null;
        let currentMusicIndex = 0;
        let musicPlaylistUrls = [];
        
        function initYouTubePlayer(videoId, containerId) {
            // For YouTube, we'll use simple iframe with autoplay disabled first
            // User can click play
            return `<iframe id="youtubePlayer" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" style="border-radius:20px;width:100%;height:200px;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }
        
        function getMusicEmbedFull(musicUrl) {
            if (!musicUrl) return '';
            
            let videoId = '';
            if (musicUrl.includes('youtu.be/')) videoId = musicUrl.split('youtu.be/')[1]?.split('?')[0];
            else if (musicUrl.includes('watch?v=')) videoId = musicUrl.split('watch?v=')[1]?.split('&')[0];
            
            if (videoId) {
                return `<iframe src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" style="border-radius:20px;width:100%;height:200px;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            }
            
            if (musicUrl.includes('spotify.com')) {
                let spotifyId = musicUrl;
                if (spotifyId.includes('playlist/')) {
                    let m = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if (m) spotifyId = m[1];
                }
                return `<iframe src="https://open.spotify.com/embed/playlist/${spotifyId}" style="border-radius:20px;width:100%;height:152px;" frameborder="0" allow="encrypted-media"></iframe>`;
            }
            
            return `<audio controls style="width:100%; border-radius:20px;" src="${musicUrl}"></audio>`;
        }
        
        function formatLastUpdated(dateString) {
            if (!dateString) return 'Belum pernah update';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Baru saja';
            if (diffMins < 60) return `${diffMins} menit lalu`;
            if (diffHours < 24) return `${diffHours} jam lalu`;
            return `${diffDays} hari lalu`;
        }

        function showCopyToast() {
            let toast = document.createElement('div');
            toast.className = 'copy-toast';
            toast.innerHTML = '<i class="fas fa-check"></i> Link tersalin!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function getUserByUsername(username) {
            return new Promise((resolve) => {
                if (!database) return resolve(null);
                database.ref('users').orderByChild('username').equalTo(username).once('value', (snap) => {
                    if (!snap.exists()) resolve(null);
                    else {
                        let user = null;
                        snap.forEach(c => user = c.val());
                        const { password, ...rest } = user;
                        resolve(rest);
                    }
                }).catch(() => resolve(null));
            });
        }
        
        function updateVisitorCount(username) {
            const storageKey = `visitor_${username}`;
            const today = new Date().toDateString();
            let data = JSON.parse(localStorage.getItem(storageKey) || '{"count":0,"lastDate":""}');
            if (data.lastDate !== today) {
                data.count++;
                data.lastDate = today;
                localStorage.setItem(storageKey, JSON.stringify(data));
            }
            return data.count + Math.floor(Math.random() * 30);
        }

        async function loadPreview() {
            const params = new URLSearchParams(window.location.search);
            const username = params.get('user');
            
            if (!username) {
                document.getElementById('mainContainer').innerHTML = `
                    <div class="error-card">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Username tidak ditemukan</h2>
                        <p>URL preview harus menyertakan ?user=username</p>
                        <button onclick="window.location.href='index.html'" class="btn-outline" style="margin-top:20px;">Kembali ke Beranda</button>
                    </div>
                `;
                return;
            }
            
            const user = await getUserByUsername(username);
            
            if (!user) {
                document.getElementById('mainContainer').innerHTML = `
                    <div class="error-card">
                        <i class="fas fa-user-slash"></i>
                        <h2>User tidak ditemukan</h2>
                        <p>Username "${escapeHtml(username)}" tidak terdaftar</p>
                        <button onclick="window.location.href='index.html'" class="btn-outline" style="margin-top:20px;">Daftar Sekarang</button>
                    </div>
                `;
                return;
            }
            
            applyTheme(user);
            applyCustomCSS(user.customCSS);
            
            let bioArr = (user.bio || '').split(',').map(s => s.trim());
            let avatarHtml = user.avatar ? `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user-astronaut"></i>';
            
            let linksHtml = '';
            const platforms = ['instagram', 'tiktok', 'youtube', 'github', 'whatsapp', 'discord'];
            platforms.forEach(p => {
                let url = user.links?.[p];
                if (url && url.trim()) {
                    let displayName = p.charAt(0).toUpperCase() + p.slice(1);
                    linksHtml += `
                        <div class="preview-link" data-url="${escapeHtml(url)}">
                            <div class="preview-link-left"><i class="fab fa-${p}"></i> ${displayName}</div>
                            <div style="display: flex; gap: 12px;">
                                <i class="fas fa-copy copy-link-btn" style="cursor: pointer; opacity: 0.6;"></i>
                                <i class="fas fa-arrow-right"></i>
                            </div>
                        </div>
                    `;
                }
            });
            
            if (user.customLinks && user.customLinks.length) {
                user.customLinks.forEach(link => {
                    if (link.name && link.url) {
                        linksHtml += `
                            <div class="preview-link" data-url="${escapeHtml(link.url)}">
                                <div class="preview-link-left"><i class="fas fa-link"></i> ${escapeHtml(link.name)}</div>
                                <div style="display: flex; gap: 12px;">
                                    <i class="fas fa-copy copy-link-btn" style="cursor: pointer; opacity: 0.6;"></i>
                                    <i class="fas fa-arrow-right"></i>
                                </div>
                            </div>
                        `;
                    }
                });
            }
            
            let musicEmbed = getMusicEmbedFull(user.musicUrl);
            let visitorCount = updateVisitorCount(username);
            let lastUpdatedText = formatLastUpdated(user.lastUpdated);
            
            document.getElementById('mainContainer').innerHTML = `
                <div class="info-bar">
                    <div class="last-updated"><i class="fas fa-clock"></i> Last update: ${lastUpdatedText}</div>
                    <div class="visitor-count"><i class="fas fa-eye"></i> ${visitorCount} views today</div>
                </div>
                <div class="profile-card">
                    <div style="text-align:center;">
                        <div class="preview-avatar">${avatarHtml}</div>
                        <div class="preview-name">${escapeHtml(user.displayName)}</div>
                        <div class="preview-bio">${escapeHtml(bioArr[0] || '')}</div>
                    </div>
                    ${linksHtml}
                    ${musicEmbed ? `<div class="music-embed">${musicEmbed}</div>` : ''}
                </div>
                <div class="footer">
                    <i class="fas fa-leaf"></i> LinkTree Pro — share your world
                </div>
            `;
            
            // Add copy link functionality
            document.querySelectorAll('.copy-link-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const linkDiv = btn.closest('.preview-link');
                    const url = linkDiv.dataset.url;
                    if (url) {
                        navigator.clipboard.writeText(url);
                        showCopyToast();
                    }
                });
            });
            
            // Add click to open link
            document.querySelectorAll('.preview-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('copy-link-btn')) {
                        window.open(link.dataset.url, '_blank');
                    }
                });
            });
        }
        
        // Theme toggle
        document.getElementById('themeTogglePreview')?.addEventListener('click', () => {
            if (currentTheme === 'light') {
                currentTheme = 'dark';
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('themeTogglePreview').innerHTML = '<i class="fas fa-sun"></i> Mode';
            } else {
                currentTheme = 'light';
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                document.getElementById('themeTogglePreview').innerHTML = '<i class="fas fa-moon"></i> Mode';
            }
        });
        
        document.getElementById('backBtn')?.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        document.getElementById('homeLogo')?.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        
        loadPreview();
    </script>
</body>
</html>
