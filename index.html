<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LinkTree - Xtxz Putra</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; transition: all 0.3s; }
        body.light-mode { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        body.dark-mode { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); color: #e0e0e0; }
        body.custom-bg { background: var(--custom-bg) !important; background-size: cover !important; background-position: center !important; background-attachment: fixed !important; }
        
        .navbar { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 24px; font-weight: 700; cursor: pointer; }
        .logo i { color: #1DB954; margin-right: 10px; }
        .logo span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; min-height: calc(100vh - 80px); }
        
        .welcome-section { text-align: center; padding: 60px 20px; }
        .welcome-section h1 { font-size: 48px; margin-bottom: 20px; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; transition: transform 0.2s; }
        .btn-primary:hover { transform: scale(1.05); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 12px 30px; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        .btn-danger { background: rgba(255,0,0,0.5); color: white; padding: 8px 20px; border-radius: 50px; border: none; cursor: pointer; }
        
        .settings-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-section { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .preview-section { position: sticky; top: 100px; max-height: 85vh; overflow-y: auto; }
        .preview-container { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; border: 2px solid rgba(255,255,255,0.2); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .section-title { font-size: 18px; margin: 20px 0 15px 0; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        
        .preview-avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.2); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preview-avatar i { font-size: 50px; color: white; }
        .preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .preview-name { text-align: center; font-size: 24px; margin-bottom: 5px; }
        .preview-bio { text-align: center; font-size: 13px; opacity: 0.8; margin-bottom: 20px; }
        .preview-link { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 50px; padding: 12px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: white; transition: 0.3s; cursor: pointer; }
        .preview-link:hover { transform: translateX(5px); background: rgba(255,255,255,0.2); }
        .preview-link-left { display: flex; align-items: center; gap: 12px; }
        
        .save-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 20px; transition: opacity 0.2s; }
        .save-btn:hover { opacity: 0.9; }
        .url-info { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
        .url-info code { background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; display: inline-block; margin: 10px 0; word-break: break-all; font-size: 12px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: #1a1f3a; border-radius: 20px; max-width: 400px; width: 100%; padding: 30px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; }
        .modal-content a { color: #667eea; text-decoration: none; }
        
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .admin-panel { margin-top: 30px; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 20px; }
        .user-card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        @media (max-width: 900px) { .settings-layout { grid-template-columns: 1fr; } .preview-section { position: static; } .welcome-section h1 { font-size: 32px; } }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1DB954; color: white; padding: 12px 24px; border-radius: 50px; z-index: 1000; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateX(-50%) translateY(20px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
    </style>
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" id="homeLogo">
                <i class="fas fa-link"></i> LinkTree<span>Firebase</span>
            </div>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>
    <div class="main-container" id="mainContainer"></div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="Password">
            <button id="doLoginBtn" class="save-btn">Login</button>
            <p style="margin-top:15px;">Belum punya akun? <a href="#" id="showRegisterBtn">Daftar</a></p>
            <p style="margin-top:10px;font-size:12px;opacity:0.7;">Demo: admin / admin123</p>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-user-plus"></i> Daftar</h2>
            <input type="text" id="regUsername" placeholder="Username" autocomplete="off">
            <input type="password" id="regPassword" placeholder="Password">
            <input type="text" id="regDisplayName" placeholder="Nama Tampilan (opsional)">
            <button id="doRegisterBtn" class="save-btn">Daftar</button>
            <p style="margin-top:15px;">Sudah punya akun? <a href="#" id="showLoginFromRegBtn">Login</a></p>
        </div>
    </div>

    <script>
        // ============================================
        // FIREBASE CONFIGURATION (SUDAH DIISI)
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyD10-8FaZa_gO_2-QBs0HLvpqWEIjC30oE",
            authDomain: "linktree-xtxz.firebaseapp.com",
            databaseURL: "https://linktree-xtxz-default-rtdb.firebaseio.com",
            projectId: "linktree-xtxz",
            storageBucket: "linktree-xtxz.firebasestorage.app",
            messagingSenderId: "551602488147",
            appId: "1:551602488147:web:67fa5a814a9fb2a688d7a6",
            measurementId: "G-Y4SX65ZM1K"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = null;

        // Helper functions
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function showLoading(btn) { if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading"></span> Loading...'; } }
        function hideLoading(btn, text) { if (btn) { btn.disabled = false; btn.innerHTML = text; } }

        // ============================================
        // FIREBASE OPERATIONS
        // ============================================
        
        // REGISTER
        async function register(username, password, displayName) {
            return new Promise((resolve) => {
                const usersRef = database.ref('users');
                usersRef.orderByChild('username').equalTo(username).once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        resolve({ success: false, error: '❌ Username sudah digunakan!' });
                        return;
                    }
                    
                    const newUser = {
                        id: 'user_' + Date.now(),
                        username: username,
                        password: password,
                        isAdmin: false,
                        displayName: displayName || '@' + username,
                        bio: 'Selamat datang di LinkTree saya!',
                        avatar: null,
                        links: { instagram: '', tiktok: '', youtube: '', github: '', whatsapp: '', discord: '' },
                        backTexts: { instagram: '@' + username, tiktok: '@' + username, youtube: username, github: username },
                        customLinks: [],
                        spotifyId: '',
                        theme: 'light',
                        bgImage: '',
                        createdAt: new Date().toISOString()
                    };
                    
                    usersRef.child(newUser.id).set(newUser, (error) => {
                        if (error) resolve({ success: false, error: error.message });
                        else resolve({ success: true, user: newUser });
                    });
                });
            });
        }

        // LOGIN
        async function login(username, password) {
            return new Promise((resolve) => {
                const usersRef = database.ref('users');
                usersRef.orderByChild('username').equalTo(username).once('value', (snapshot) => {
                    if (!snapshot.exists()) {
                        resolve({ success: false, error: '❌ Username tidak ditemukan!' });
                        return;
                    }
                    
                    let foundUser = null;
                    snapshot.forEach((child) => {
                        const user = child.val();
                        if (user.password === password) foundUser = user;
                    });
                    
                    if (foundUser) {
                        const { password: _, ...userWithoutPass } = foundUser;
                        resolve({ success: true, user: userWithoutPass });
                    } else {
                        resolve({ success: false, error: '❌ Password salah!' });
                    }
                });
            });
        }

        // UPDATE USER
        async function updateUser(userId, updates) {
            return new Promise((resolve) => {
                database.ref('users/' + userId).update(updates, (error) => {
                    if (error) resolve({ success: false, error: error.message });
                    else resolve({ success: true });
                });
            });
        }

        // GET USER BY USERNAME
        async function getUserByUsername(username) {
            return new Promise((resolve) => {
                database.ref('users').orderByChild('username').equalTo(username).once('value', (snapshot) => {
                    if (!snapshot.exists()) resolve(null);
                    else {
                        let user = null;
                        snapshot.forEach((child) => { user = child.val(); });
                        const { password, ...userWithoutPass } = user;
                        resolve(userWithoutPass);
                    }
                });
            });
        }

        // GET ALL USERS (ADMIN ONLY)
        async function getAllUsers() {
            return new Promise((resolve) => {
                database.ref('users').once('value', (snapshot) => {
                    const users = [];
                    snapshot.forEach((child) => {
                        const user = child.val();
                        const { password, ...userWithoutPass } = user;
                        users.push(userWithoutPass);
                    });
                    resolve(users);
                });
            });
        }

        // DELETE USER (ADMIN ONLY)
        async function deleteUser(userId) {
            return new Promise((resolve) => {
                database.ref('users/' + userId).remove((error) => {
                    if (error) resolve({ success: false, error: error.message });
                    else resolve({ success: true });
                });
            });
        }

        // CREATE ADMIN (FIRST TIME ONLY)
        async function createAdminIfNotExists() {
            return new Promise((resolve) => {
                const usersRef = database.ref('users');
                usersRef.orderByChild('username').equalTo('admin').once('value', (snapshot) => {
                    if (!snapshot.exists()) {
                        const adminUser = {
                            id: 'admin_1',
                            username: 'admin',
                            password: 'admin123',
                            isAdmin: true,
                            displayName: '@Xtxz Putra',
                            bio: '🚀 Creator | Developer | Gamer,⚡ Roblox Exploit & Web Dev,🎮 Live everyday!,💻 Code is my passion',
                            avatar: null,
                            links: {
                                instagram: 'https://instagram.com/xtxzputra',
                                tiktok: 'https://tiktok.com/@xtxzputra',
                                youtube: 'https://youtube.com/c/xtxzputra',
                                github: 'https://github.com/xtxzputra',
                                whatsapp: 'https://wa.me/6281234567890',
                                discord: 'https://discord.gg/invite/xtxzputra'
                            },
                            backTexts: {
                                instagram: '@xtxzputra',
                                tiktok: '@xtxzputra',
                                youtube: 'Xtxz Putra',
                                github: 'github/xtxzputra'
                            },
                            customLinks: [],
                            spotifyId: '3LR1I9C0C1Jzl6wJuS9int',
                            theme: 'light',
                            bgImage: '',
                            createdAt: new Date().toISOString()
                        };
                        usersRef.child(adminUser.id).set(adminUser);
                    }
                    resolve();
                });
            });
        }

        // Apply theme
        function applyTheme(user) {
            const theme = user?.theme || 'light';
            const bgImage = user?.bgImage || '';
            if (bgImage) {
                document.body.style.setProperty('--custom-bg', `url('${bgImage}')`);
                document.body.className = 'custom-bg';
            } else {
                document.body.className = theme === 'dark' ? 'dark-mode' : 'light-mode';
                document.body.style.removeProperty('--custom-bg');
            }
        }

        // ============================================
        // RENDER FUNCTIONS
        // ============================================

        // Render LinkTree Page (Public)
        async function renderLinkTreePage(username) {
            const user = await getUserByUsername(username);
            if (!user) {
                document.getElementById('mainContainer').innerHTML = `
                    <div class="welcome-section">
                        <h1>😢 User Tidak Ditemukan</h1>
                        <p>User dengan username "${username}" tidak ada di database.</p>
                        <button onclick="window.location.href=''" class="btn-primary">Kembali ke Beranda</button>
                    </div>
                `;
                return;
            }
            
            applyTheme(user);
            const bioArray = (user.bio || '').split(',').map(s => s.trim()).filter(s => s);
            let avatarHtml = user.avatar ? `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user-astronaut"></i>';
            
            let linksHtml = '';
            const platforms = [
                { key: 'instagram', name: 'Instagram', icon: 'fab fa-instagram' },
                { key: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok' },
                { key: 'youtube', name: 'YouTube', icon: 'fab fa-youtube' },
                { key: 'github', name: 'GitHub', icon: 'fab fa-github' },
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp' },
                { key: 'discord', name: 'Discord', icon: 'fab fa-discord' }
            ];
            
            platforms.forEach(p => {
                const url = user.links?.[p.key];
                if (url && url.trim()) {
                    linksHtml += `<a href="${url}" target="_blank" class="preview-link"><div class="preview-link-left"><i class="${p.icon}"></i><span>${p.name}</span></div><i class="fas fa-arrow-right"></i></a>`;
                }
            });
            
            if (user.customLinks && user.customLinks.length > 0) {
                user.customLinks.forEach(link => {
                    if (link.name && link.url) {
                        linksHtml += `<a href="${link.url}" target="_blank" class="preview-link"><div class="preview-link-left"><i class="fas fa-link"></i><span>${escapeHtml(link.name)}</span></div><i class="fas fa-arrow-right"></i></a>`;
                    }
                });
            }
            
            let spotifyHtml = '';
            if (user.spotifyId && user.spotifyId.trim()) {
                let spotifyId = user.spotifyId.trim();
                if (spotifyId.includes('open.spotify.com')) {
                    const match = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if (match) spotifyId = match[1];
                }
                spotifyHtml = `<div style="margin-top:20px;"><iframe src="https://open.spotify.com/embed/playlist/${spotifyId}?utm_source=generator" frameborder="0" allowfullscreen="" style="border-radius:12px;width:100%;height:152px;"></iframe></div>`;
            }
            
            document.getElementById('mainContainer').innerHTML = `
                <div style="max-width:500px;margin:0 auto;">
                    <div style="text-align:center;">
                        <div class="preview-avatar" style="margin:0 auto 15px;">${avatarHtml}</div>
                        <div class="preview-name">${escapeHtml(user.displayName || '@' + user.username)}</div>
                        <div class="preview-bio">${escapeHtml(bioArray[0] || '')}</div>
                    </div>
                    <div style="margin-top:20px;">${linksHtml}</div>
                    ${spotifyHtml}
                    <div class="footer" style="text-align:center;font-size:11px;opacity:0.6;margin-top:20px;padding:20px;">
                        <i class="fas fa-link"></i> Made with LinkTree Firebase
                    </div>
                </div>
            `;
            
            const navLinks = document.getElementById('navLinks');
            if (currentUser) {
                navLinks.innerHTML = `<span>👋 ${escapeHtml(currentUser.displayName || currentUser.username)}</span><button id="goSettingsBtn" class="btn-outline">Settings</button><button id="logoutNavBtn" class="btn-outline">Logout</button>`;
                document.getElementById('goSettingsBtn')?.addEventListener('click', () => { window.history.pushState({}, '', '/'); renderApp(); });
                document.getElementById('logoutNavBtn')?.addEventListener('click', logout);
            } else {
                navLinks.innerHTML = `<button id="navLoginBtn" class="btn-primary">Login / Daftar</button>`;
                document.getElementById('navLoginBtn')?.addEventListener('click', () => openModal('login'));
            }
        }

        // Render Settings Page (Dashboard User)
        async function renderSettingsPage() {
            if (!currentUser) {
                renderApp();
                return;
            }
            
            // Refresh user data from Firebase
            const freshUser = await getUserByUsername(currentUser.username);
            if (freshUser) currentUser = freshUser;
            
            applyTheme(currentUser);
            const bioArray = (currentUser.bio || '').split(',').map(s => s.trim()).filter(s => s);
            
            const customLinksHtml = (currentUser.customLinks || []).map((link, idx) => `
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <input type="text" placeholder="Nama Link (contoh: Website)" value="${escapeHtml(link.name)}" data-custom-name="${idx}" style="flex:1">
                    <input type="text" placeholder="URL" value="${escapeHtml(link.url)}" data-custom-url="${idx}" style="flex:2">
                    <button data-custom-remove="${idx}" style="padding:0 15px;background:rgba(255,0,0,0.5);border:none;border-radius:8px;color:white;cursor:pointer;font-size:16px;">✖</button>
                </div>
            `).join('');
            
            let previewAvatarHtml = currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user-astronaut"></i>';
            let previewLinksHtml = '';
            const platforms = [
                { key: 'instagram', name: 'Instagram', icon: 'fab fa-instagram' },
                { key: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok' },
                { key: 'youtube', name: 'YouTube', icon: 'fab fa-youtube' },
                { key: 'github', name: 'GitHub', icon: 'fab fa-github' },
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp' },
                { key: 'discord', name: 'Discord', icon: 'fab fa-discord' }
            ];
            platforms.forEach(p => {
                if (currentUser.links?.[p.key]?.trim()) {
                    previewLinksHtml += `<div class="preview-link"><div class="preview-link-left"><i class="${p.icon}"></i><span>${p.name}</span></div><i class="fas fa-arrow-right"></i></div>`;
                }
            });
            (currentUser.customLinks || []).forEach(link => {
                if (link.name && link.url) {
                    previewLinksHtml += `<div class="preview-link"><div class="preview-link-left"><i class="fas fa-link"></i><span>${escapeHtml(link.name)}</span></div><i class="fas fa-arrow-right"></i></div>`;
                }
            });
            
            let previewSpotifyHtml = '';
            if (currentUser.spotifyId && currentUser.spotifyId.trim()) {
                let spotifyId = currentUser.spotifyId.trim();
                if (spotifyId.includes('open.spotify.com')) {
                    const match = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if (match) spotifyId = match[1];
                }
                previewSpotifyHtml = `<div style="margin-top:20px;"><iframe src="https://open.spotify.com/embed/playlist/${spotifyId}?utm_source=generator" frameborder="0" allowfullscreen="" style="border-radius:12px;width:100%;height:152px;"></iframe></div>`;
            }
            
            const userUrl = `${window.location.origin}${window.location.pathname}?user=${currentUser.username}`;
            
            // Admin panel (hanya untuk admin)
            let adminPanelHtml = '';
            if (currentUser.isAdmin) {
                const allUsers = await getAllUsers();
                const nonAdminUsers = allUsers.filter(u => !u.isAdmin);
                adminPanelHtml = `
                    <div class="admin-panel">
                        <h3><i class="fas fa-shield-alt"></i> Admin Panel</h3>
                        <p>Total User: ${nonAdminUsers.length}</p>
                        <div id="adminUserList">
                            ${nonAdminUsers.length === 0 ? '<p style="opacity:0.6;">Belum ada user terdaftar</p>' : ''}
                            ${nonAdminUsers.map(u => `
                                <div class="user-card">
                                    <div><strong>${escapeHtml(u.username)}</strong><br><small>${escapeHtml(u.displayName || '')}</small></div>
                                    <div>
                                        <button class="view-user" data-username="${u.username}" style="background:#1DB954;border:none;padding:5px 12px;border-radius:20px;color:white;cursor:pointer;">Lihat</button>
                                        <button class="delete-user" data-userid="${u.id}" style="background:rgba(255,0,0,0.5);border:none;padding:5px 12px;border-radius:20px;color:white;cursor:pointer;margin-left:5px;">Hapus</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('mainContainer').innerHTML = `
                <div class="settings-layout">
                    <div class="form-section">
                        <h2><i class="fas fa-user-cog"></i> Edit Profile</h2>
                        <div class="form-group">
                            <label>Foto Profile</label>
                            <div style="display:flex;gap:15px;align-items:center;">
                                <div class="preview-avatar" id="avatarPreviewUpload" style="width:80px;height:80px;cursor:pointer;background:rgba(0,0,0,0.3);">${currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-camera" style="font-size:30px;"></i>'}</div>
                                <input type="file" id="avatarUploadInput" accept="image/*" style="display:none;">
                                <button id="clearAvatarBtn" class="btn-outline" style="padding:8px 15px;">Hapus Foto</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Nama Tampilan</label>
                            <input type="text" id="displayName" value="${escapeHtml(currentUser.displayName || '')}" placeholder="@username">
                        </div>
                        <div class="form-group">
                            <label>Bio (pisahkan dengan koma , untuk efek typing)</label>
                            <textarea id="bio" rows="3" placeholder="Contoh: Creator,Developer,Gamer">${escapeHtml(currentUser.bio || '')}</textarea>
                        </div>
                        <div class="section-title">Sosial Media</div>
                        <div class="form-group"><label>Instagram URL</label><input type="text" id="instagramUrl" value="${escapeHtml(currentUser.links?.instagram || '')}" placeholder="https://instagram.com/..."></div>
                        <div class="form-group"><label>TikTok URL</label><input type="text" id="tiktokUrl" value="${escapeHtml(currentUser.links?.tiktok || '')}" placeholder="https://tiktok.com/@..."></div>
                        <div class="form-group"><label>YouTube URL</label><input type="text" id="youtubeUrl" value="${escapeHtml(currentUser.links?.youtube || '')}" placeholder="https://youtube.com/c/..."></div>
                        <div class="form-group"><label>GitHub URL</label><input type="text" id="githubUrl" value="${escapeHtml(currentUser.links?.github || '')}" placeholder="https://github.com/..."></div>
                        <div class="form-group"><label>WhatsApp URL</label><input type="text" id="whatsappUrl" value="${escapeHtml(currentUser.links?.whatsapp || '')}" placeholder="https://wa.me/628xxxx"></div>
                        <div class="form-group"><label>Discord URL</label><input type="text" id="discordUrl" value="${escapeHtml(currentUser.links?.discord || '')}" placeholder="https://discord.gg/..."></div>
                        <div class="section-title">Username di Card Belakang (Flip Card)</div>
                        <div class="form-group"><label>Instagram @username</label><input type="text" id="backInstagram" value="${escapeHtml(currentUser.backTexts?.instagram || '')}"></div>
                        <div class="form-group"><label>TikTok @username</label><input type="text" id="backTiktok" value="${escapeHtml(currentUser.backTexts?.tiktok || '')}"></div>
                        <div class="form-group"><label>YouTube Channel</label><input type="text" id="backYoutube" value="${escapeHtml(currentUser.backTexts?.youtube || '')}"></div>
                        <div class="form-group"><label>GitHub Username</label><input type="text" id="backGithub" value="${escapeHtml(currentUser.backTexts?.github || '')}"></div>
                        <div class="section-title">Custom Link</div>
                        <div id="customLinksForm">${customLinksHtml}</div>
                        <button id="addCustomLinkBtn" class="btn-outline" style="width:100%;padding:10px;margin-top:10px;"><i class="fas fa-plus"></i> Tambah Link Custom</button>
                        <div class="section-title">Spotify Playlist</div>
                        <div class="form-group">
                            <label>Playlist ID atau URL</label>
                            <input type="text" id="spotifyId" value="${escapeHtml(currentUser.spotifyId || '')}" placeholder="Contoh: 37i9dQZF1DXcBWIGoYBM5M">
                        </div>
                        <div class="section-title">Tema & Background</div>
                        <div class="form-group">
                            <label>Mode Tema</label>
                            <select id="themeMode">
                                <option value="light" ${currentUser.theme === 'light' ? 'selected' : ''}>Light Mode</option>
                                <option value="dark" ${currentUser.theme === 'dark' ? 'selected' : ''}>Dark Mode</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Background Custom (URL Gambar)</label>
                            <input type="text" id="bgImage" value="${escapeHtml(currentUser.bgImage || '')}" placeholder="https://example.com/gambar.jpg">
                        </div>
                        <button id="saveSettingsBtn" class="save-btn"><i class="fas fa-save"></i> Simpan Perubahan</button>
                        <div class="url-info">
                            <i class="fas fa-link"></i> LinkTree Kamu:<br>
                            <code id="userUrl">${userUrl}</code><br>
                            <button id="copyUrlBtn" class="btn-outline" style="margin-top:10px;"><i class="fas fa-copy"></i> Copy URL</button>
                            <button id="viewLinktreeBtn" class="btn-primary" style="margin-left:10px;background:#1DB954;"><i class="fas fa-external-link-alt"></i> Buka LinkTree</button>
                        </div>
                    </div>
                    <div class="preview-section">
                        <div class="preview-container">
                            <h3 style="margin-bottom:15px;"><i class="fas fa-eye"></i> Live Preview</h3>
                            <div style="text-align:center;">
                                <div class="preview-avatar" style="margin:0 auto 15px;">${previewAvatarHtml}</div>
                                <div class="preview-name">${escapeHtml(currentUser.displayName || '@' + currentUser.username)}</div>
                                <div class="preview-bio">${escapeHtml(bioArray[0] || '')}</div>
                            </div>
                            <div style="margin-top:20px;">${previewLinksHtml}</div>
                            ${previewSpotifyHtml}
                        </div>
                    </div>
                </div>
                ${adminPanelHtml}
            `;
            
            // Bind events
            const avatarPreview = document.getElementById('avatarPreviewUpload');
            const avatarInput = document.getElementById('avatarUploadInput');
            if (avatarPreview) {
                avatarPreview.addEventListener('click', () => avatarInput.click());
            }
            if (avatarInput) {
                avatarInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file && file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            await updateUser(currentUser.id, { avatar: event.target.result });
                            showToast('Foto profile berhasil diupdate!');
                            renderSettingsPage();
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
            
            document.getElementById('clearAvatarBtn')?.addEventListener('click', async () => {
                await updateUser(currentUser.id, { avatar: null });
                showToast('Foto profile dihapus!');
                renderSettingsPage();
            });
            
            document.getElementById('saveSettingsBtn')?.addEventListener('click', async () => {
                const customLinks = [];
                document.querySelectorAll('[data-custom-name]').forEach(input => {
                    const idx = parseInt(input.dataset.customName);
                    const urlInput = document.querySelector(`[data-custom-url="${idx}"]`);
                    if (input.value.trim() && urlInput?.value.trim()) {
                        customLinks.push({ name: input.value.trim(), url: urlInput.value.trim() });
                    }
                });
                
                await updateUser(currentUser.id, {
                    displayName: document.getElementById('displayName')?.value || '',
                    bio: document.getElementById('bio')?.value || '',
                    links: {
                        instagram: document.getElementById('instagramUrl')?.value || '',
                        tiktok: document.getElementById('tiktokUrl')?.value || '',
                        youtube: document.getElementById('youtubeUrl')?.value || '',
                        github: document.getElementById('githubUrl')?.value || '',
                        whatsapp: document.getElementById('whatsappUrl')?.value || '',
                        discord: document.getElementById('discordUrl')?.value || ''
                    },
                    backTexts: {
                        instagram: document.getElementById('backInstagram')?.value || '',
                        tiktok: document.getElementById('backTiktok')?.value || '',
                        youtube: document.getElementById('backYoutube')?.value || '',
                        github: document.getElementById('backGithub')?.value || ''
                    },
                    customLinks: customLinks,
                    spotifyId: document.getElementById('spotifyId')?.value || '',
                    theme: document.getElementById('themeMode')?.value || 'light',
                    bgImage: document.getElementById('bgImage')?.value || ''
                });
                showToast('✅ Data berhasil disimpan ke Firebase!');
                renderSettingsPage();
            });
            
            document.getElementById('addCustomLinkBtn')?.addEventListener('click', async () => {
                await updateUser(currentUser.id, { customLinks: [...(currentUser.customLinks || []), { name: '', url: '' }] });
                renderSettingsPage();
            });
            
            document.querySelectorAll('[data-custom-remove]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idx = parseInt(btn.dataset.customRemove);
                    const newLinks = [...(currentUser.customLinks || [])];
                    newLinks.splice(idx, 1);
                    await updateUser(currentUser.id, { customLinks: newLinks });
                    renderSettingsPage();
                });
            });
            
            document.getElementById('copyUrlBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('userUrl')?.textContent || '');
                showToast('URL LinkTree disalin!');
            });
            
            document.getElementById('viewLinktreeBtn')?.addEventListener('click', () => {
                window.open(`?user=${currentUser.username}`, '_blank');
            });
            
            // Admin events
            document.querySelectorAll('.view-user').forEach(btn => {
                btn.addEventListener('click', () => {
                    window.open(`?user=${btn.dataset.username}`, '_blank');
                });
            });
            document.querySelectorAll('.delete-user').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('⚠️ Hapus user ini? Data tidak bisa dikembalikan!')) {
                        await deleteUser(btn.dataset.userid);
                        showToast('User berhasil dihapus!');
                        renderSettingsPage();
                    }
                });
            });
        }

        // Render Welcome Page (Belum Login)
        function renderWelcomePage() {
            document.body.className = 'light-mode';
            document.getElementById('mainContainer').innerHTML = `
                <div class="welcome-section">
                    <h1>Buat LinkTree <span style="background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;background-clip:text;color:transparent;">Gratis!</span></h1>
                    <p>✨ Dengan Firebase, data tersimpan di cloud!<br>Login di HP dan laptop, data tetap sama.</p>
                    <div class="cta-buttons" style="display:flex;gap:20px;justify-content:center;margin-top:30px;">
                        <button id="openLoginBtn" class="btn-primary">Login</button>
                        <button id="openRegisterBtn" class="btn-outline">Daftar Gratis</button>
                    </div>
                    <div style="margin-top:60px;background:rgba(0,0,0,0.3);padding:25px;border-radius:20px;max-width:500px;margin-left:auto;margin-right:auto;">
                        <h3>🚀 Keunggulan LinkTree Firebase:</h3>
                        <ul style="text-align:left;margin-top:15px;list-style:none;">
                            <li>✅ Data tersimpan di Firebase cloud</li>
                            <li>✅ Bisa login dari HP dan laptop</li>
                            <li>✅ LinkTree user lain BISA dilihat</li>
                            <li>✅ Admin bisa kelola semua user</li>
                            <li>✅ URL unik: ?user=usernamekamu</li>
                            <li>✅ GRATIS selamanya!</li>
                        </ul>
                    </div>
                    <div style="margin-top:40px;">
                        <p style="opacity:0.6;">Demo akun admin: <strong>admin</strong> / <strong>admin123</strong></p>
                    </div>
                </div>
            `;
            
            const navLinks = document.getElementById('navLinks');
            navLinks.innerHTML = `<button id="navLoginBtn" class="btn-primary">Login / Daftar</button>`;
            
            document.getElementById('openLoginBtn')?.addEventListener('click', () => openModal('login'));
            document.getElementById('openRegisterBtn')?.addEventListener('click', () => openModal('register'));
            document.getElementById('navLoginBtn')?.addEventListener('click', () => openModal('login'));
        }

        // Main Render
        async function renderApp() {
            const savedUserId = localStorage.getItem('currentUserId');
            if (savedUserId && !currentUser) {
                const users = await getAllUsers();
                currentUser = users.find(u => u.id === savedUserId);
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const usernameParam = urlParams.get('user');
            
            if (usernameParam && (!currentUser || currentUser.username !== usernameParam)) {
                renderLinkTreePage(usernameParam);
                return;
            }
            
            if (currentUser) {
                renderSettingsPage();
            } else {
                renderWelcomePage();
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUserId');
            showToast('Berhasil logout!');
            renderApp();
        }

        function openModal(type) { 
            document.getElementById(type === 'login' ? 'loginModal' : 'registerModal').classList.add('show'); 
        }
        
        function closeModals() { 
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); 
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        
        document.getElementById('doLoginBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('doLoginBtn');
            showLoading(btn);
            const result = await login(
                document.getElementById('loginUsername').value, 
                document.getElementById('loginPassword').value
            );
            hideLoading(btn, 'Login');
            if (result.success) {
                currentUser = result.user;
                localStorage.setItem('currentUserId', currentUser.id);
                closeModals();
                renderApp();
            } else {
                alert(result.error);
            }
        });
        
        document.getElementById('doRegisterBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('doRegisterBtn');
            showLoading(btn);
            const result = await register(
                document.getElementById('regUsername').value,
                document.getElementById('regPassword').value,
                document.getElementById('regDisplayName').value
            );
            hideLoading(btn, 'Daftar');
            if (result.success) {
                alert('✅ Pendaftaran berhasil! Silakan login.');
                closeModals();
                document.getElementById('loginUsername').value = document.getElementById('regUsername').value;
                openModal('login');
            } else {
                alert(result.error);
            }
        });
        
        document.getElementById('showRegisterBtn')?.addEventListener('click', (e) => { 
            e.preventDefault(); 
            closeModals(); 
            openModal('register'); 
        });
        
        document.getElementById('showLoginFromRegBtn')?.addEventListener('click', (e) => { 
            e.preventDefault(); 
            closeModals(); 
            openModal('login'); 
        });
        
        document.getElementById('homeLogo')?.addEventListener('click', () => { 
            window.history.pushState({}, '', '/'); 
            renderApp(); 
        });
        
        // Initialize
        createAdminIfNotExists();
        renderApp();
    </script>
</body>
</html>
