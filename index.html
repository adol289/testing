<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WarungKu - Belanja Makanan & Minuman</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f7fb; min-height: 100vh; }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link {
            background: rgba(255,255,255,0.15);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .nav-link.active { background: rgba(255,255,255,0.35); }
        .nav-link:hover { background: rgba(255,255,255,0.25); }
        .cart-icon {
            position: relative;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 40px;
            transition: all 0.3s;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
        }
        .logout-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        .logout-btn:hover { background: white; color: #667eea; }

        /* Container */
        .container { max-width: 1400px; margin: 0 auto; padding: 32px; }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 32px;
            padding: 48px;
            color: white;
            margin-bottom: 40px;
            text-align: center;
        }
        .hero h1 { font-size: 42px; margin-bottom: 16px; }
        .hero p { font-size: 18px; opacity: 0.9; }

        /* Categories */
        .categories {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .category-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: #64748b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .category-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin-bottom: 40px;
        }

        /* Product Card */
        .product-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            position: relative;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15); }
        .product-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .product-badge.stok-habis { background: #64748b; }
        .product-image { height: 200px; background: linear-gradient(135deg, #667eea20, #764ba220); display: flex; align-items: center; justify-content: center; font-size: 64px; }
        .product-info { padding: 20px; }
        .product-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
        .product-category { font-size: 12px; color: #667eea; font-weight: 600; margin-bottom: 10px; }
        .product-price { font-size: 24px; font-weight: 800; color: #667eea; margin-bottom: 8px; }
        .product-stock { font-size: 13px; color: #64748b; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .stock-low { color: #ef4444; font-weight: 600; }
        .buy-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .buy-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Profile Section */
        .profile-section {
            background: white;
            border-radius: 32px;
            padding: 32px;
            margin-bottom: 32px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        .profile-info h2 { font-size: 28px; color: #1e293b; }
        .profile-info p { color: #64748b; margin-top: 4px; }
        .profile-badge {
            background: #dcfce7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-top: 8px;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .profile-stat-card {
            background: #f8fafc;
            padding: 16px;
            border-radius: 20px;
            text-align: center;
        }
        .profile-stat-card h4 { font-size: 24px; font-weight: 800; color: #667eea; }
        .profile-stat-card p { font-size: 13px; color: #64748b; margin-top: 4px; }
        .edit-profile-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Cart Sidebar */
        .cart-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        .cart-overlay.active { right: 0; }
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: white;
            z-index: 1001;
            transition: all 0.3s;
            box-shadow: -5px 0 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        .cart-sidebar.active { right: 0; }
        .cart-header {
            padding: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-cart {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .cart-item-actions { display: flex; align-items: center; gap: 12px; }
        .cart-item-actions button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #e2e8f0;
            background: white;
            cursor: pointer;
        }
        .cart-footer { padding: 24px; border-top: 2px solid #e2e8f0; }
        .cart-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .empty-cart { text-align: center; color: #94a3b8; padding: 40px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 1100;
            display: none;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { bottom: -50px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
        .page { display: none; }
        .page.active { display: block; }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .hero h1 { font-size: 28px; }
            .navbar { padding: 12px 20px; }
            .nav-link span { display: none; }
            .nav-link i { font-size: 20px; }
            .nav-link { padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="showPage('shop')"><i class="fas fa-store"></i><span>WarungKu</span></div>
    <div class="nav-links">
        <div class="nav-link" onclick="showPage('shop')"><i class="fas fa-shopping-bag"></i><span> Belanja</span></div>
        <div class="nav-link" onclick="showPage('profile')"><i class="fas fa-user-circle"></i><span> Profil</span></div>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" id="cartCount">0</span>
        </div>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span id="usernameDisplay">User</span>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
</div>

<!-- HALAMAN TOKO -->
<div id="shopPage" class="page active">
    <div class="container">
        <div class="hero">
            <h1>🍔 Selamat Datang di WarungKu</h1>
            <p>Makanan & Minuman Segar • Harga Terjangkau • Stok Realtime</p>
        </div>

        <div class="categories">
            <button class="category-btn active" onclick="filterProducts('all')">Semua</button>
            <button class="category-btn" onclick="filterProducts('makanan')">🍚 Makanan</button>
            <button class="category-btn" onclick="filterProducts('minuman')">🥤 Minuman</button>
            <button class="category-btn" onclick="filterProducts('snack')">🍿 Snack</button>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </div>
</div>

<!-- HALAMAN PROFILE -->
<div id="profilePage" class="page">
    <div class="container">
        <div class="profile-section">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div class="profile-info">
                    <h2 id="profileName">User Name</h2>
                    <p id="profileEmail">user@example.com</p>
                    <span class="profile-badge" id="profileBadge">🥉 Member Silver</span>
                </div>
            </div>

            <div class="profile-stats">
                <div class="profile-stat-card">
                    <h4 id="totalTransaksi">0</h4>
                    <p>Total Transaksi</p>
                </div>
                <div class="profile-stat-card">
                    <h4 id="totalBelanja">Rp 0</h4>
                    <p>Total Belanja</p>
                </div>
                <div class="profile-stat-card">
                    <h4 id="memberSince">-</h4>
                    <p>Bergabung Sejak</p>
                </div>
            </div>

            <div style="text-align: center;">
                <button class="edit-profile-btn" onclick="showEditProfile()"><i class="fas fa-edit"></i> Edit Profil</button>
            </div>
        </div>
    </div>
</div>

<!-- Cart Sidebar -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3><i class="fas fa-shopping-cart"></i> Keranjang Belanja</h3>
        <button class="close-cart" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
        <div class="empty-cart">Keranjang masih kosong</div>
    </div>
    <div class="cart-footer">
        <div class="cart-total">
            <span>Total</span>
            <span id="cartTotal">Rp 0</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Bayar Sekarang</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    let products = [];
    let cart = [];
    let currentFilter = "all";
    let currentUser = null;

    // Load data
    function loadProducts() {
        const saved = localStorage.getItem('warung_products');
        if (saved) {
            products = JSON.parse(saved);
        } else {
            products = [
                { id: 1, name: "Nasi Goreng Special", category: "makanan", price: 25000, stock: 15, image: "🍳", badge: "Populer" },
                { id: 2, name: "Mie Ayam Bakso", category: "makanan", price: 18000, stock: 12, image: "🍜", badge: "" },
                { id: 3, name: "Ayam Geprek", category: "makanan", price: 20000, stock: 8, image: "🍗", badge: "Pedas" },
                { id: 4, name: "Es Teh Manis", category: "minuman", price: 5000, stock: 50, image: "🧋", badge: "" },
                { id: 5, name: "Es Kopi Susu", category: "minuman", price: 15000, stock: 20, image: "☕", badge: "Best Seller" },
                { id: 6, name: "Jus Alpukat", category: "minuman", price: 12000, stock: 12, image: "🥑", badge: "" },
                { id: 7, name: "Pisang Goreng", category: "snack", price: 10000, stock: 18, image: "🍌", badge: "" },
                { id: 8, name: "Kentang Goreng", category: "snack", price: 12000, stock: 25, image: "🍟", badge: "" },
                { id: 9, name: "Roti Bakar", category: "snack", price: 13000, stock: 10, image: "🍞", badge: "" },
            ];
            saveProducts();
        }
    }

    function saveProducts() { localStorage.setItem('warung_products', JSON.stringify(products)); }

    // Session
    const session = localStorage.getItem('warung_session');
    if (!session) { window.location.href = 'login.html'; }
    currentUser = JSON.parse(session);
    if (currentUser.role === 'admin') { window.location.href = 'admin.html'; }
    
    document.getElementById('usernameDisplay').innerText = currentUser.username;
    document.getElementById('profileName').innerText = currentUser.username;
    document.getElementById('profileEmail').innerText = currentUser.email;
    
    // Load transaksi dari localStorage
    let userTransactions = JSON.parse(localStorage.getItem(`transactions_${currentUser.uid}`)) || [];
    let totalBelanja = userTransactions.reduce((sum, t) => sum + t.total, 0);
    document.getElementById('totalTransaksi').innerText = userTransactions.length;
    document.getElementById('totalBelanja').innerHTML = `Rp ${totalBelanja.toLocaleString('id-ID')}`;
    
    const memberSince = localStorage.getItem(`memberSince_${currentUser.uid}`) || new Date().toLocaleDateString('id-ID');
    localStorage.setItem(`memberSince_${currentUser.uid}`, memberSince);
    document.getElementById('memberSince').innerText = memberSince;
    
    // Badge berdasarkan total belanja
    let badge = "🥉 Member Silver";
    if (totalBelanja >= 500000) badge = "👑 Member Platinum";
    else if (totalBelanja >= 200000) badge = "🥈 Member Gold";
    document.getElementById('profileBadge').innerHTML = badge;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.style.backgroundColor = isError ? '#ef4444' : '#10b981';
        toast.innerHTML = message;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    function updateCartCount() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').innerText = totalItems;
    }

    function updateCartUI() {
        const cartItemsDiv = document.getElementById('cartItems');
        const cartTotalSpan = document.getElementById('cartTotal');
        if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-basket" style="font-size: 48px;"></i><p>Keranjang kosong</p></div>';
            cartTotalSpan.innerHTML = 'Rp 0';
            updateCartCount();
            return;
        }
        let html = '', total = 0;
        cart.forEach(item => {
            const product = products.find(p => p.id === item.id);
            if (product) {
                total += product.price * item.quantity;
                html += `<div class="cart-item"><div><h4>${product.name}</h4><p>Rp ${product.price.toLocaleString('id-ID')} x ${item.quantity}</p></div>
                    <div class="cart-item-actions">
                        <button onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button onclick="removeFromCart(${item.id})" style="background:#fee2e2;color:#ef4444;">✕</button>
                    </div></div>`;
            }
        });
        cartItemsDiv.innerHTML = html;
        cartTotalSpan.innerHTML = `Rp ${total.toLocaleString('id-ID')}`;
        updateCartCount();
    }

    function updateQuantity(productId, change) {
        const index = cart.findIndex(item => item.id === productId);
        if (index !== -1) {
            const newQuantity = cart[index].quantity + change;
            const product = products.find(p => p.id === productId);
            if (newQuantity <= 0) {
                cart.splice(index, 1);
                showToast(`${product.name} dihapus dari keranjang`);
            } else if (newQuantity <= product.stock) {
                cart[index].quantity = newQuantity;
            } else {
                showToast(`Stok ${product.name} hanya ${product.stock}`, true);
            }
            updateCartUI();
        }
    }

    function removeFromCart(productId) {
        const product = products.find(p => p.id === productId);
        cart = cart.filter(item => item.id !== productId);
        updateCartUI();
        showToast(`${product.name} dihapus`);
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;
        if (product.stock <= 0) { showToast(`${product.name} habis!`, true); return; }
        const existing = cart.find(item => item.id === productId);
        if (existing) {
            if (existing.quantity < product.stock) { existing.quantity++; showToast(`+1 ${product.name}`); }
            else { showToast(`Stok ${product.name} tidak cukup`, true); }
        } else {
            cart.push({ id: productId, quantity: 1 });
            showToast(`${product.name} ditambahkan`);
        }
        updateCartUI();
    }

    function checkout() {
        if (cart.length === 0) { showToast("Keranjang kosong!", true); return; }
        let outOfStock = [];
        for (let item of cart) {
            const product = products.find(p => p.id === item.id);
            if (!product || product.stock < item.quantity) outOfStock.push(product?.name);
        }
        if (outOfStock.length > 0) { showToast(`Stok habis: ${outOfStock.join(", ")}`, true); return; }
        
        let total = 0;
        for (let item of cart) {
            const product = products.find(p => p.id === item.id);
            product.stock -= item.quantity;
            total += product.price * item.quantity;
        }
        saveProducts();
        
        // Simpan transaksi
        const transactions = JSON.parse(localStorage.getItem(`transactions_${currentUser.uid}`)) || [];
        transactions.unshift({ id: Date.now(), items: [...cart], total: total, date: new Date().toLocaleString('id-ID') });
        localStorage.setItem(`transactions_${currentUser.uid}`, JSON.stringify(transactions));
        
        showToast(`✅ Berhasil! Total: Rp ${total.toLocaleString('id-ID')}`);
        cart = [];
        updateCartUI();
        toggleCart();
        renderProducts();
        
        // Update profile stats
        const newTotal = transactions.reduce((sum, t) => sum + t.total, 0);
        document.getElementById('totalTransaksi').innerText = transactions.length;
        document.getElementById('totalBelanja').innerHTML = `Rp ${newTotal.toLocaleString('id-ID')}`;
        let newBadge = "🥉 Member Silver";
        if (newTotal >= 500000) newBadge = "👑 Member Platinum";
        else if (newTotal >= 200000) newBadge = "🥈 Member Gold";
        document.getElementById('profileBadge').innerHTML = newBadge;
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        let filtered = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);
        if (filtered.length === 0) {
            grid.innerHTML = '<div style="text-align:center;padding:60px;color:#94a3b8;">Tidak ada produk</div>';
            return;
        }
        grid.innerHTML = filtered.map(p => `
            <div class="product-card">
                ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
                ${p.stock === 0 ? `<div class="product-badge stok-habis">Stok Habis</div>` : ''}
                <div class="product-image">${p.image || '🍽️'}</div>
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="product-category">${p.category === 'makanan' ? '🍚 Makanan' : p.category === 'minuman' ? '🥤 Minuman' : '🍿 Snack'}</div>
                    <div class="product-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                    <div class="product-stock"><i class="fas fa-box"></i> Stok: <span class="${p.stock <= 5 ? 'stock-low' : ''}">${p.stock}</span> ${p.stock <= 5 && p.stock > 0 ? '⚠️ Sisa sedikit!' : ''}</div>
                    <button class="buy-btn" onclick="addToCart(${p.id})" ${p.stock === 0 ? 'disabled' : ''}>${p.stock === 0 ? 'Stok Habis' : '🛒 Beli Sekarang'}</button>
                </div>
            </div>
        `).join('');
    }

    function filterProducts(category) {
        currentFilter = category;
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderProducts();
    }

    function toggleCart() {
        document.getElementById('cartOverlay').classList.toggle('active');
        document.getElementById('cartSidebar').classList.toggle('active');
    }

    function showPage(page) {
        document.getElementById('shopPage').classList.remove('active');
        document.getElementById('profilePage').classList.remove('active');
        if (page === 'shop') document.getElementById('shopPage').classList.add('active');
        else document.getElementById('profilePage').classList.add('active');
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        event.target.closest('.nav-link').classList.add('active');
    }

    function showEditProfile() { showToast("Fitur edit profil akan segera hadir!"); }
    function logout() { localStorage.removeItem('warung_session'); window.location.href = 'login.html'; }

    loadProducts();
    renderProducts();
    updateCartUI();

    window.addToCart = addToCart;
    window.updateQuantity = updateQuantity;
    window.removeFromCart = removeFromCart;
    window.checkout = checkout;
    window.toggleCart = toggleCart;
    window.filterProducts = filterProducts;
    window.showPage = showPage;
    window.logout = logout;
    window.showEditProfile = showEditProfile;
</script>
</body>
</html>
