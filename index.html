<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LinkTree - Xtxz Putra</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; transition: all 0.3s; }
        body.light-mode { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        body.dark-mode { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); color: #e0e0e0; }
        body.custom-bg { background: var(--custom-bg) !important; background-size: cover !important; background-position: center !important; background-attachment: fixed !important; }
        
        .navbar { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 24px; font-weight: 700; cursor: pointer; }
        .logo i { color: #1DB954; margin-right: 10px; }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; min-height: calc(100vh - 80px); }
        
        .welcome-section { text-align: center; padding: 60px 20px; }
        .welcome-section h1 { font-size: 48px; margin-bottom: 20px; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 12px 30px; border-radius: 50px; cursor: pointer; }
        
        .settings-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-section { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .preview-section { position: sticky; top: 100px; max-height: 85vh; overflow-y: auto; }
        .preview-container { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; border: 2px solid rgba(255,255,255,0.2); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .section-title { font-size: 18px; margin: 20px 0 15px 0; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        
        .preview-avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.2); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preview-avatar i { font-size: 50px; color: white; }
        .preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .preview-name { text-align: center; font-size: 24px; margin-bottom: 5px; }
        .preview-bio { text-align: center; font-size: 13px; opacity: 0.8; margin-bottom: 20px; }
        .preview-link { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 50px; padding: 12px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: white; transition: 0.3s; }
        .preview-link:hover { transform: translateX(5px); background: rgba(255,255,255,0.2); }
        .preview-link-left { display: flex; align-items: center; gap: 12px; }
        
        .save-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .url-info { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
        .url-info code { background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; display: inline-block; margin: 10px 0; word-break: break-all; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: #1a1f3a; border-radius: 20px; max-width: 400px; width: 100%; padding: 30px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; }
        
        @media (max-width: 900px) { .settings-layout { grid-template-columns: 1fr; } .preview-section { position: static; } }
    </style>
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" id="homeLogo"><i class="fas fa-link"></i> LinkTree<span style="background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;background-clip:text;color:transparent;">Vercel</span></div>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>
    <div class="main-container" id="mainContainer"></div>

    <!-- Modal -->
    <div id="loginModal" class="modal"><div class="modal-content"><h2>Login</h2><input type="text" id="loginUsername" placeholder="Username"><input type="password" id="loginPassword" placeholder="Password"><button id="doLoginBtn" class="save-btn">Login</button><p>Belum punya akun? <a href="#" id="showRegisterBtn">Daftar</a></p><p style="margin-top:10px;font-size:12px;">Demo: admin / admin123</p></div></div>
    <div id="registerModal" class="modal"><div class="modal-content"><h2>Daftar</h2><input type="text" id="regUsername" placeholder="Username"><input type="password" id="regPassword" placeholder="Password"><input type="text" id="regDisplayName" placeholder="Nama Tampilan"><button id="doRegisterBtn" class="save-btn">Daftar</button><p>Sudah punya akun? <a href="#" id="showLoginFromRegBtn">Login</a></p></div></div>

    <script>
        // ============================================
        // API CONFIG - GANTI DENGAN URL VERCEL KAMU
        // ============================================
        const API_BASE = window.location.origin;
        
        let currentUser = null;

        async function apiCall(endpoint, method = 'POST', body = {}) {
            const response = await fetch(`${API_BASE}/api/${endpoint}`, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: method !== 'GET' ? JSON.stringify(body) : undefined
            });
            return response.json();
        }

        async function login(username, password) {
            const result = await apiCall('auth', 'POST', { action: 'login', username, password });
            if (result.success) {
                currentUser = result.user;
                localStorage.setItem('currentUserId', currentUser.id);
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                renderApp();
                return true;
            }
            return false;
        }

        async function register(userData) {
            const result = await apiCall('auth', 'POST', { action: 'register', userData });
            return result.success;
        }

        async function updateUser(updates) {
            const result = await apiCall('update', 'POST', { userId: currentUser.id, updates });
            if (result.success) {
                currentUser = result.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                renderApp();
                return true;
            }
            return false;
        }

        async function getUserByUsername(username) {
            const result = await apiCall(`user/${username}`, 'GET');
            return result.success ? result.user : null;
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUserId');
            localStorage.removeItem('currentUser');
            renderApp();
        }

        function applyTheme(user) {
            const theme = user?.theme || 'light';
            const bgImage = user?.bgImage || '';
            if (bgImage) {
                document.body.style.setProperty('--custom-bg', `url('${bgImage}')`);
                document.body.className = 'custom-bg';
            } else {
                document.body.className = theme === 'dark' ? 'dark-mode' : 'light-mode';
                document.body.style.removeProperty('--custom-bg');
            }
        }

        function renderLinkTreePage(user) {
            applyTheme(user);
            const bioArray = (user.bio || '').split(',').map(s => s.trim()).filter(s => s);
            let avatarHtml = user.avatar ? `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user-astronaut"></i>';
            
            let linksHtml = '';
            const platforms = [
                { key: 'instagram', name: 'Instagram', icon: 'fab fa-instagram' },
                { key: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok' },
                { key: 'youtube', name: 'YouTube', icon: 'fab fa-youtube' },
                { key: 'github', name: 'GitHub', icon: 'fab fa-github' },
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp' },
                { key: 'discord', name: 'Discord', icon: 'fab fa-discord' }
            ];
            
            platforms.forEach(p => {
                const url = user.links?.[p.key];
                if (url && url.trim()) {
                    linksHtml += `<a href="${url}" target="_blank" class="preview-link"><div class="preview-link-left"><i class="${p.icon}"></i><span>${p.name}</span></div><i class="fas fa-arrow-right"></i></a>`;
                }
            });
            
            if (user.customLinks) {
                user.customLinks.forEach(link => {
                    if (link.name && link.url) {
                        linksHtml += `<a href="${link.url}" target="_blank" class="preview-link"><div class="preview-link-left"><i class="fas fa-link"></i><span>${escapeHtml(link.name)}</span></div><i class="fas fa-arrow-right"></i></a>`;
                    }
                });
            }
            
            let spotifyHtml = '';
            if (user.spotifyId && user.spotifyId.trim()) {
                let spotifyId = user.spotifyId.trim();
                if (spotifyId.includes('open.spotify.com')) {
                    const match = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if (match) spotifyId = match[1];
                }
                spotifyHtml = `<div style="margin-top:20px;"><iframe src="https://open.spotify.com/embed/playlist/${spotifyId}?utm_source=generator" frameborder="0" allowfullscreen="" style="border-radius:12px;width:100%;height:152px;"></iframe></div>`;
            }
            
            document.getElementById('mainContainer').innerHTML = `
                <div style="max-width:500px;margin:0 auto;">
                    <div style="text-align:center;">
                        <div class="preview-avatar" style="margin:0 auto 15px;">${avatarHtml}</div>
                        <div class="preview-name">${escapeHtml(user.displayName || '@' + user.username)}</div>
                        <div class="preview-bio">${escapeHtml(bioArray[0] || '')}</div>
                    </div>
                    <div style="margin-top:20px;">${linksHtml}</div>
                    ${spotifyHtml}
                    <div class="footer" style="text-align:center;font-size:11px;opacity:0.6;margin-top:20px;padding:20px;"><i class="fas fa-link"></i> Made with LinkTree Vercel</div>
                </div>
            `;
            
            const navLinks = document.getElementById('navLinks');
            if (currentUser) {
                navLinks.innerHTML = `<span>👋 ${escapeHtml(currentUser.displayName || currentUser.username)}</span><button id="goSettingsBtn" class="btn-outline">Settings</button><button id="logoutNavBtn" class="btn-outline">Logout</button>`;
                document.getElementById('goSettingsBtn')?.addEventListener('click', () => { window.history.pushState({}, '', '/'); renderApp(); });
                document.getElementById('logoutNavBtn')?.addEventListener('click', logout);
            } else {
                navLinks.innerHTML = `<button id="navLoginBtn" class="btn-primary">Login / Daftar</button>`;
                document.getElementById('navLoginBtn')?.addEventListener('click', () => openModal('login'));
            }
        }

        function renderSettingsPage() {
            if (!currentUser) {
                renderApp();
                return;
            }
            applyTheme(currentUser);
            const bioArray = (currentUser.bio || '').split(',').map(s => s.trim()).filter(s => s);
            
            const customLinksHtml = (currentUser.customLinks || []).map((link, idx) => `
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <input type="text" placeholder="Nama Link" value="${escapeHtml(link.name)}" data-custom-name="${idx}" style="flex:1">
                    <input type="text" placeholder="URL" value="${escapeHtml(link.url)}" data-custom-url="${idx}" style="flex:2">
                    <button data-custom-remove="${idx}" style="padding:0 15px;background:rgba(255,0,0,0.5);border:none;border-radius:8px;color:white;cursor:pointer;">✖</button>
                </div>
            `).join('');
            
            let previewAvatarHtml = currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user-astronaut"></i>';
            let previewLinksHtml = '';
            const platforms = [
                { key: 'instagram', name: 'Instagram', icon: 'fab fa-instagram' },
                { key: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok' },
                { key: 'youtube', name: 'YouTube', icon: 'fab fa-youtube' },
                { key: 'github', name: 'GitHub', icon: 'fab fa-github' },
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp' },
                { key: 'discord', name: 'Discord', icon: 'fab fa-discord' }
            ];
            platforms.forEach(p => {
                if (currentUser.links?.[p.key]?.trim()) {
                    previewLinksHtml += `<div class="preview-link"><div class="preview-link-left"><i class="${p.icon}"></i><span>${p.name}</span></div><i class="fas fa-arrow-right"></i></div>`;
                }
            });
            (currentUser.customLinks || []).forEach(link => {
                if (link.name && link.url) {
                    previewLinksHtml += `<div class="preview-link"><div class="preview-link-left"><i class="fas fa-link"></i><span>${escapeHtml(link.name)}</span></div><i class="fas fa-arrow-right"></i></div>`;
                }
            });
            
            let previewSpotifyHtml = '';
            if (currentUser.spotifyId && currentUser.spotifyId.trim()) {
                let spotifyId = currentUser.spotifyId.trim();
                if (spotifyId.includes('open.spotify.com')) {
                    const match = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if (match) spotifyId = match[1];
                }
                previewSpotifyHtml = `<div style="margin-top:20px;"><iframe src="https://open.spotify.com/embed/playlist/${spotifyId}?utm_source=generator" frameborder="0" allowfullscreen="" style="border-radius:12px;width:100%;height:152px;"></iframe></div>`;
            }
            
            const userUrl = `${window.location.origin}?user=${currentUser.username}`;
            
            document.getElementById('mainContainer').innerHTML = `
                <div class="settings-layout">
                    <div class="form-section">
                        <h2><i class="fas fa-user-cog"></i> Edit Profile (Vercel Backend)</h2>
                        <div class="form-group">
                            <label>Foto Profile</label>
                            <div style="display:flex;gap:15px;align-items:center;">
                                <div class="preview-avatar" id="avatarPreviewUpload" style="width:80px;height:80px;cursor:pointer;">${currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user"></i>'}</div>
                                <input type="file" id="avatarUploadInput" accept="image/*" style="display:none;">
                                <button id="clearAvatarBtn" class="btn-outline" style="padding:8px 15px;">Hapus Foto</button>
                            </div>
                        </div>
                        <div class="form-group"><label>Nama Tampilan</label><input type="text" id="displayName" value="${escapeHtml(currentUser.displayName || '')}"></div>
                        <div class="form-group"><label>Bio (pisahkan dengan koma)</label><textarea id="bio" rows="3">${escapeHtml(currentUser.bio || '')}</textarea></div>
                        <div class="section-title">Sosial Media</div>
                        <div class="form-group"><label>Instagram URL</label><input type="text" id="instagramUrl" value="${escapeHtml(currentUser.links?.instagram || '')}"></div>
                        <div class="form-group"><label>TikTok URL</label><input type="text" id="tiktokUrl" value="${escapeHtml(currentUser.links?.tiktok || '')}"></div>
                        <div class="form-group"><label>YouTube URL</label><input type="text" id="youtubeUrl" value="${escapeHtml(currentUser.links?.youtube || '')}"></div>
                        <div class="form-group"><label>GitHub URL</label><input type="text" id="githubUrl" value="${escapeHtml(currentUser.links?.github || '')}"></div>
                        <div class="form-group"><label>WhatsApp URL</label><input type="text" id="whatsappUrl" value="${escapeHtml(currentUser.links?.whatsapp || '')}"></div>
                        <div class="form-group"><label>Discord URL</label><input type="text" id="discordUrl" value="${escapeHtml(currentUser.links?.discord || '')}"></div>
                        <div class="section-title">Username di Card Belakang</div>
                        <div class="form-group"><label>Instagram</label><input type="text" id="backInstagram" value="${escapeHtml(currentUser.backTexts?.instagram || '')}"></div>
                        <div class="form-group"><label>TikTok</label><input type="text" id="backTiktok" value="${escapeHtml(currentUser.backTexts?.tiktok || '')}"></div>
                        <div class="form-group"><label>YouTube</label><input type="text" id="backYoutube" value="${escapeHtml(currentUser.backTexts?.youtube || '')}"></div>
                        <div class="form-group"><label>GitHub</label><input type="text" id="backGithub" value="${escapeHtml(currentUser.backTexts?.github || '')}"></div>
                        <div class="section-title">Custom Link</div>
                        <div id="customLinksForm">${customLinksHtml}</div>
                        <button id="addCustomLinkBtn" class="btn-outline" style="width:100%;padding:10px;margin-top:10px;"><i class="fas fa-plus"></i> Tambah Link</button>
                        <div class="section-title">Spotify Playlist</div>
                        <div class="form-group"><label>Playlist ID atau URL</label><input type="text" id="spotifyId" value="${escapeHtml(currentUser.spotifyId || '')}"></div>
                        <div class="section-title">Tema & Background</div>
                        <div class="form-group"><label>Mode Tema</label><select id="themeMode"><option value="light" ${currentUser.theme === 'light' ? 'selected' : ''}>Light Mode</option><option value="dark" ${currentUser.theme === 'dark' ? 'selected' : ''}>Dark Mode</option></select></div>
                        <div class="form-group"><label>Background Custom (URL)</label><input type="text" id="bgImage" value="${escapeHtml(currentUser.bgImage || '')}"></div>
                        <button id="saveSettingsBtn" class="save-btn"><i class="fas fa-save"></i> Simpan ke Server</button>
                        <div class="url-info"><i class="fas fa-link"></i> LinkTree Kamu:<br><code id="userUrl">${userUrl}</code><br><button id="copyUrlBtn" class="btn-outline" style="margin-top:10px;"><i class="fas fa-copy"></i> Copy URL</button><button id="viewLinktreeBtn" class="btn-success" style="margin-left:10px;background:#1DB954;border:none;padding:8px 15px;border-radius:50px;color:white;cursor:pointer;"><i class="fas fa-external-link-alt"></i> Buka</button></div>
                    </div>
                    <div class="preview-section">
                        <div class="preview-container"><h3 style="margin-bottom:15px;"><i class="fas fa-eye"></i> Live Preview</h3>
                        <div style="text-align:center;"><div class="preview-avatar" style="margin:0 auto 15px;">${previewAvatarHtml}</div><div class="preview-name">${escapeHtml(currentUser.displayName || '@' + currentUser.username)}</div><div class="preview-bio">${escapeHtml(bioArray[0] || '')}</div></div>
                        <div style="margin-top:20px;">${previewLinksHtml}</div>${previewSpotifyHtml}</div>
                    </div>
                </div>
            `;
            
            // Bind events
            const avatarPreview = document.getElementById('avatarPreviewUpload');
            const avatarInput = document.getElementById('avatarUploadInput');
            avatarPreview?.addEventListener('click', () => avatarInput.click());
            avatarInput?.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => updateUser({ avatar: event.target.result });
                    reader.readAsDataURL(file);
                }
            });
            document.getElementById('clearAvatarBtn')?.addEventListener('click', () => updateUser({ avatar: null }));
            document.getElementById('saveSettingsBtn')?.addEventListener('click', async () => {
                const customLinks = [];
                document.querySelectorAll('[data-custom-name]').forEach(input => {
                    const idx = parseInt(input.dataset.customName);
                    const urlInput = document.querySelector(`[data-custom-url="${idx}"]`);
                    if (input.value.trim() && urlInput?.value.trim()) customLinks.push({ name: input.value.trim(), url: urlInput.value.trim() });
                });
                await updateUser({
                    displayName: document.getElementById('displayName')?.value || '',
                    bio: document.getElementById('bio')?.value || '',
                    links: { instagram: document.getElementById('instagramUrl')?.value || '', tiktok: document.getElementById('tiktokUrl')?.value || '', youtube: document.getElementById('youtubeUrl')?.value || '', github: document.getElementById('githubUrl')?.value || '', whatsapp: document.getElementById('whatsappUrl')?.value || '', discord: document.getElementById('discordUrl')?.value || '' },
                    backTexts: { instagram: document.getElementById('backInstagram')?.value || '', tiktok: document.getElementById('backTiktok')?.value || '', youtube: document.getElementById('backYoutube')?.value || '', github: document.getElementById('backGithub')?.value || '' },
                    customLinks: customLinks,
                    spotifyId: document.getElementById('spotifyId')?.value || '',
                    theme: document.getElementById('themeMode')?.value || 'light',
                    bgImage: document.getElementById('bgImage')?.value || ''
                });
                alert('✅ Data tersimpan di server Vercel!');
            });
            document.getElementById('addCustomLinkBtn')?.addEventListener('click', () => updateUser({ customLinks: [...(currentUser.customLinks || []), { name: '', url: '' }] }));
            document.querySelectorAll('[data-custom-remove]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.customRemove);
                    const newLinks = [...(currentUser.customLinks || [])];
                    newLinks.splice(idx, 1);
                    updateUser({ customLinks: newLinks });
                });
            });
            document.getElementById('copyUrlBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('userUrl')?.textContent || '');
                alert('URL disalin!');
            });
            document.getElementById('viewLinktreeBtn')?.addEventListener('click', () => window.open(`?user=${currentUser.username}`, '_blank'));
        }

        function renderWelcomePage() {
            document.body.className = 'light-mode';
            document.getElementById('mainContainer').innerHTML = `
                <div class="welcome-section">
                    <h1>LinkTree <span style="background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;background-clip:text;color:transparent;">Vercel</span></h1>
                    <p>✨ Dengan backend Vercel, data tersimpan di server!<br>Login di HP dan laptop, data tetap sama.</p>
                    <div class="cta-buttons"><button id="openLoginBtn" class="btn-primary">Login</button><button id="openRegisterBtn" class="btn-outline">Daftar Gratis</button></div>
                    <div style="margin-top:50px;background:rgba(0,0,0,0.3);padding:25px;border-radius:20px;"><h3>🚀 Keunggulan Versi Vercel Backend:</h3><ul style="text-align:left;margin-top:15px;list-style:none;"><li>✅ Data tersimpan di server (bukan di browser)</li><li>✅ Bisa login dari HP dan laptop, data sama</li><li>✅ LinkTree user lain BISA dilihat (via ?user=username)</li><li>✅ Admin bisa kelola semua user</li><li>✅ Hosting GRATIS di Vercel</li></ul></div>
                </div>
            `;
            document.getElementById('navLinks').innerHTML = `<button id="navLoginBtn" class="btn-primary">Login / Daftar</button>`;
            document.getElementById('openLoginBtn')?.addEventListener('click', () => openModal('login'));
            document.getElementById('openRegisterBtn')?.addEventListener('click', () => openModal('register'));
            document.getElementById('navLoginBtn')?.addEventListener('click', () => openModal('login'));
        }

        function renderApp() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser && !currentUser) {
                currentUser = JSON.parse(savedUser);
            }
            const urlParams = new URLSearchParams(window.location.search);
            const usernameParam = urlParams.get('user');
            if (usernameParam && !currentUser) {
                getUserByUsername(usernameParam).then(user => { if (user) renderLinkTreePage(user); else renderWelcomePage(); });
                return;
            }
            if (currentUser) renderSettingsPage();
            else renderWelcomePage();
        }

        function openModal(type) { document.getElementById(type === 'login' ? 'loginModal' : 'registerModal').classList.add('show'); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        document.getElementById('doLoginBtn')?.addEventListener('click', async () => { if (await login(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value)) closeModals(); else alert('Login gagal!'); });
        document.getElementById('doRegisterBtn')?.addEventListener('click', async () => { if (await register({ username: document.getElementById('regUsername').value, password: document.getElementById('regPassword').value, displayName: document.getElementById('regDisplayName').value })) { alert('Daftar berhasil! Silakan login.'); closeModals(); } else alert('Username sudah ada!'); });
        document.getElementById('showRegisterBtn')?.addEventListener('click', (e) => { e.preventDefault(); closeModals(); openModal('register'); });
        document.getElementById('showLoginFromRegBtn')?.addEventListener('click', (e) => { e.preventDefault(); closeModals(); openModal('login'); });
        document.getElementById('homeLogo')?.addEventListener('click', () => { window.history.pushState({}, '', '/'); renderApp(); });

        renderApp();
    </script>
</body>
</html>
