<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LinkTree - Login & Buat LinkTree Kamu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo i {
            color: #1DB954;
            margin-right: 10px;
        }

        .logo span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links button, .nav-links a {
            padding: 8px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-danger {
            background: rgba(255,0,0,0.5);
            color: white;
        }

        .nav-links button:hover {
            transform: translateY(-2px);
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Welcome Section */
        .welcome-section {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-section h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .welcome-section p {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-buttons button {
            padding: 15px 40px;
            font-size: 16px;
        }

        /* Dashboard User */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .form-section {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 85vh;
            overflow-y: auto;
        }

        .preview-section {
            position: sticky;
            top: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .preview-container {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .section-title {
            font-size: 18px;
            margin: 20px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        /* LinkTree Preview */
        .linktree-preview {
            max-width: 400px;
            margin: 0 auto;
        }

        .preview-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-avatar i {
            font-size: 50px;
            color: white;
        }

        .preview-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-name {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .preview-bio {
            text-align: center;
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .preview-link {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .preview-link:hover {
            transform: translateX(5px);
            background: rgba(255,255,255,0.2);
        }

        .preview-link-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1f3a;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
        }

        /* Admin Panel */
        .admin-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 25px;
        }

        .user-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .user-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-card button {
            padding: 5px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .view-user-linktree {
            background: #1DB954;
            color: white;
        }

        .delete-user {
            background: rgba(255,0,0,0.5);
            color: white;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-link"></i>
                <span>LinkTree<span>Generator</span></span>
            </div>
            <div class="nav-links" id="navLinks">
                <!-- Akan diisi berdasarkan login status -->
            </div>
        </div>
    </nav>

    <div class="main-container" id="mainContainer">
        <!-- Konten akan diisi JavaScript -->
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button id="doLoginBtn" class="save-btn" style="margin-top: 10px;">Login</button>
            <p style="margin-top: 15px;">Belum punya akun? <a href="#" id="showRegisterBtn" style="color: #667eea;">Daftar</a></p>
            <p style="margin-top: 10px; font-size: 12px;">Demo akun admin: username <strong>admin</strong> password <strong>admin123</strong></p>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-user-plus"></i> Daftar</h2>
            <input type="text" id="regUsername" placeholder="Username">
            <input type="password" id="regPassword" placeholder="Password">
            <input type="text" id="regDisplayName" placeholder="Nama Tampilan">
            <button id="doRegisterBtn" class="save-btn" style="margin-top: 10px;">Daftar</button>
            <p style="margin-top: 15px;">Sudah punya akun? <a href="#" id="showLoginFromRegBtn" style="color: #667eea;">Login</a></p>
        </div>
    </div>

    <script>
        // ============================================
        // DATA STORAGE (localStorage)
        // ============================================
        let currentUser = null;
        let users = [];
        let currentUserData = null;

        // Load data dari localStorage
        function loadData() {
            const savedUsers = localStorage.getItem('linktree_users');
            if(savedUsers) {
                users = JSON.parse(savedUsers);
            } else {
                // Default admin account
                users = [{
                    id: 'admin_' + Date.now(),
                    username: 'admin',
                    password: 'admin123',
                    isAdmin: true,
                    displayName: '@Xtxz Putra',
                    bio: '🚀 Creator | Developer | Gamer,⚡ Roblox Exploit & Web Dev,🎮 Live everyday!',
                    avatar: null,
                    links: {
                        instagram: 'https://instagram.com/xtxzputra',
                        tiktok: 'https://tiktok.com/@xtxzputra',
                        youtube: 'https://youtube.com/c/xtxzputra',
                        github: 'https://github.com/xtxzputra',
                        whatsapp: 'https://wa.me/6281234567890',
                        discord: 'https://discord.gg/invite/xtxzputra'
                    },
                    backTexts: {
                        instagram: '@xtxzputra',
                        tiktok: '@xtxzputra',
                        youtube: 'Xtxz Putra',
                        github: 'github/xtxzputra'
                    },
                    customLinks: [],
                    spotifyId: '3LR1I9C0C1Jzl6wJuS9int',
                    theme: 'light',
                    bgImage: ''
                }];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('linktree_users', JSON.stringify(users));
        }

        // Cari user by username
        function findUser(username) {
            return users.find(u => u.username === username);
        }

        // Login
        function login(username, password) {
            const user = findUser(username);
            if(user && user.password === password) {
                currentUser = user;
                localStorage.setItem('currentUserId', user.id);
                renderApp();
                return true;
            }
            return false;
        }

        // Register
        function register(username, password, displayName) {
            if(findUser(username)) return false;
            const newUser = {
                id: 'user_' + Date.now(),
                username: username,
                password: password,
                isAdmin: false,
                displayName: displayName || '@' + username,
                bio: 'Selamat datang di LinkTree saya!',
                avatar: null,
                links: {
                    instagram: '',
                    tiktok: '',
                    youtube: '',
                    github: '',
                    whatsapp: '',
                    discord: ''
                },
                backTexts: {
                    instagram: '@' + username,
                    tiktok: '@' + username,
                    youtube: username,
                    github: username
                },
                customLinks: [],
                spotifyId: '',
                theme: 'light',
                bgImage: ''
            };
            users.push(newUser);
            saveData();
            return true;
        }

        // Update user data
        function updateUserData(updates) {
            if(!currentUser) return;
            const index = users.findIndex(u => u.id === currentUser.id);
            if(index !== -1) {
                users[index] = { ...users[index], ...updates };
                currentUser = users[index];
                localStorage.setItem('currentUserId', currentUser.id);
                saveData();
                renderApp();
            }
        }

        // Delete user (admin only)
        function deleteUser(userId) {
            if(!currentUser?.isAdmin) return;
            users = users.filter(u => u.id !== userId);
            saveData();
            renderApp();
        }

        // Logout
        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUserId');
            renderApp();
        }

        // ============================================
        // RENDER LINKTREE PREVIEW
        // ============================================
        function renderLinkTreePreview(userData) {
            const bioArray = (userData.bio || '').split(',').map(s => s.trim()).filter(s => s);
            const theme = userData.theme || 'light';
            const bgImage = userData.bgImage || '';
            
            let bgStyle = '';
            if(bgImage) {
                bgStyle = `background: url('${bgImage}') center/cover fixed no-repeat;`;
            } else {
                bgStyle = theme === 'dark' ? 'background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);' : 'background: linear-gradient(135deg, #667eea, #764ba2);';
            }

            let avatarHtml = '';
            if(userData.avatar) {
                avatarHtml = `<img src="${userData.avatar}" style="width: 100%; height: 100%; object-fit: cover;">`;
            } else {
                avatarHtml = '<i class="fas fa-user-astronaut"></i>';
            }

            let linksHtml = '';
            const platforms = [
                { key: 'instagram', name: 'Instagram', icon: 'fab fa-instagram' },
                { key: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok' },
                { key: 'youtube', name: 'YouTube', icon: 'fab fa-youtube' },
                { key: 'github', name: 'GitHub', icon: 'fab fa-github' },
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp' },
                { key: 'discord', name: 'Discord', icon: 'fab fa-discord' }
            ];

            platforms.forEach(p => {
                const url = userData.links?.[p.key];
                const backText = userData.backTexts?.[p.key] || '';
                if(url && url.trim()) {
                    linksHtml += `
                        <a href="${url}" target="_blank" class="preview-link">
                            <div class="preview-link-left">
                                <i class="${p.icon}"></i>
                                <span>${p.name}</span>
                            </div>
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    `;
                }
            });

            if(userData.customLinks) {
                userData.customLinks.forEach(link => {
                    if(link.name && link.url) {
                        linksHtml += `
                            <a href="${link.url}" target="_blank" class="preview-link">
                                <div class="preview-link-left">
                                    <i class="fas fa-link"></i>
                                    <span>${escapeHtml(link.name)}</span>
                                </div>
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        `;
                    }
                });
            }

            let spotifyHtml = '';
            if(userData.spotifyId && userData.spotifyId.trim()) {
                let spotifyId = userData.spotifyId.trim();
                if(spotifyId.includes('open.spotify.com')) {
                    const match = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if(match) spotifyId = match[1];
                }
                spotifyHtml = `
                    <div style="margin-top: 20px;">
                        <iframe src="https://open.spotify.com/embed/playlist/${spotifyId}?utm_source=generator" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border-radius: 12px; width: 100%; height: 152px;"></iframe>
                    </div>
                `;
            }

            return `
                <div style="text-align: center;">
                    <div class="preview-avatar" style="margin: 0 auto 15px;">${avatarHtml}</div>
                    <div class="preview-name">${escapeHtml(userData.displayName || '@user')}</div>
                    <div class="preview-bio">${escapeHtml(bioArray[0] || '')}</div>
                </div>
                <div style="margin-top: 20px;">
                    ${linksHtml}
                </div>
                ${spotifyHtml}
                <div class="footer" style="text-align: center; font-size: 11px; opacity: 0.6; margin-top: 20px;">
                    <i class="fas fa-link"></i> Made with LinkTree Generator
                </div>
            `;
        }

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================
        // RENDER FORM (User Settings)
        // ============================================
        function renderUserSettings() {
            if(!currentUser) return '';

            const customLinksHtml = (currentUser.customLinks || []).map((link, idx) => `
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" placeholder="Nama Link" value="${escapeHtml(link.name)}" data-custom-name="${idx}" style="flex:1">
                    <input type="text" placeholder="URL" value="${escapeHtml(link.url)}" data-custom-url="${idx}" style="flex:2">
                    <button data-custom-remove="${idx}" style="padding: 0 15px; background: rgba(255,0,0,0.5); border: none; border-radius: 8px; color: white; cursor: pointer;">✖</button>
                </div>
            `).join('');

            return `
                <div class="form-section">
                    <h2><i class="fas fa-user-cog"></i> Edit Profile Kamu</h2>
                    
                    <div class="form-group">
                        <label>Foto Profile</label>
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <div class="preview-avatar" id="avatarPreviewUpload" style="width: 80px; height: 80px; cursor: pointer;">
                                ${currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user"></i>'}
                            </div>
                            <input type="file" id="avatarUploadInput" accept="image/*" style="display: none;">
                            <button id="clearAvatarBtn" class="btn-outline" style="padding: 8px 15px;">Hapus Foto</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nama Tampilan</label>
                        <input type="text" id="displayName" value="${escapeHtml(currentUser.displayName || '')}">
                    </div>

                    <div class="form-group">
                        <label>Bio (pisahkan dengan koma , untuk efek typing)</label>
                        <textarea id="bio" rows="3">${escapeHtml(currentUser.bio || '')}</textarea>
                    </div>

                    <div class="section-title">Sosial Media</div>
                    <div class="form-group"><label>Instagram URL</label><input type="text" id="instagramUrl" value="${escapeHtml(currentUser.links?.instagram || '')}"></div>
                    <div class="form-group"><label>TikTok URL</label><input type="text" id="tiktokUrl" value="${escapeHtml(currentUser.links?.tiktok || '')}"></div>
                    <div class="form-group"><label>YouTube URL</label><input type="text" id="youtubeUrl" value="${escapeHtml(currentUser.links?.youtube || '')}"></div>
                    <div class="form-group"><label>GitHub URL</label><input type="text" id="githubUrl" value="${escapeHtml(currentUser.links?.github || '')}"></div>
                    <div class="form-group"><label>WhatsApp URL</label><input type="text" id="whatsappUrl" value="${escapeHtml(currentUser.links?.whatsapp || '')}"></div>
                    <div class="form-group"><label>Discord URL</label><input type="text" id="discordUrl" value="${escapeHtml(currentUser.links?.discord || '')}"></div>

                    <div class="section-title">Username di Card Belakang</div>
                    <div class="form-group"><label>Instagram @username</label><input type="text" id="backInstagram" value="${escapeHtml(currentUser.backTexts?.instagram || '')}"></div>
                    <div class="form-group"><label>TikTok @username</label><input type="text" id="backTiktok" value="${escapeHtml(currentUser.backTexts?.tiktok || '')}"></div>
                    <div class="form-group"><label>YouTube Channel</label><input type="text" id="backYoutube" value="${escapeHtml(currentUser.backTexts?.youtube || '')}"></div>
                    <div class="form-group"><label>GitHub Username</label><input type="text" id="backGithub" value="${escapeHtml(currentUser.backTexts?.github || '')}"></div>

                    <div class="section-title">Custom Link</div>
                    <div id="customLinksForm">${customLinksHtml}</div>
                    <button id="addCustomLinkBtn" class="btn-outline" style="width: 100%; padding: 10px; margin-top: 10px;"><i class="fas fa-plus"></i> Tambah Link</button>

                    <div class="section-title">Spotify Playlist</div>
                    <div class="form-group">
                        <label>Playlist ID atau URL</label>
                        <input type="text" id="spotifyId" value="${escapeHtml(currentUser.spotifyId || '')}">
                    </div>

                    <div class="section-title">Tema & Background</div>
                    <div class="form-group">
                        <label>Mode Tema</label>
                        <select id="themeMode">
                            <option value="light" ${currentUser.theme === 'light' ? 'selected' : ''}>Light Mode</option>
                            <option value="dark" ${currentUser.theme === 'dark' ? 'selected' : ''}>Dark Mode</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Background Custom (URL Gambar)</label>
                        <input type="text" id="bgImage" value="${escapeHtml(currentUser.bgImage || '')}">
                    </div>

                    <button id="saveSettingsBtn" class="save-btn"><i class="fas fa-save"></i> Simpan Perubahan</button>
                </div>
            `;
        }

        // ============================================
        // RENDER ADMIN PANEL
        // ============================================
        function renderAdminPanel() {
            if(!currentUser?.isAdmin) return '';

            const userListHtml = users.filter(u => !u.isAdmin).map(user => `
                <div class="user-card">
                    <div>
                        <strong>${escapeHtml(user.username)}</strong><br>
                        <small>${escapeHtml(user.displayName || '')}</small>
                    </div>
                    <div>
                        <button class="view-user-linktree" data-user-id="${user.id}"><i class="fas fa-eye"></i> Lihat LinkTree</button>
                        <button class="delete-user" data-user-id="${user.id}"><i class="fas fa-trash"></i> Hapus</button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="admin-panel">
                    <h2><i class="fas fa-shield-alt"></i> Admin Panel</h2>
                    <p>Total User: ${users.filter(u => !u.isAdmin).length}</p>
                    <div class="user-list">
                        ${userListHtml || '<p style="opacity:0.6;">Belum ada user terdaftar</p>'}
                    </div>
                </div>
            `;
        }

        // ============================================
        // RENDER APP UTAMA
        // ============================================
        function renderApp() {
            const mainContainer = document.getElementById('mainContainer');
            const navLinks = document.getElementById('navLinks');
            const savedUserId = localStorage.getItem('currentUserId');
            
            if(savedUserId && !currentUser) {
                currentUser = users.find(u => u.id === savedUserId);
            }

            if(!currentUser) {
                // Tampilkan halaman welcome
                mainContainer.innerHTML = `
                    <div class="welcome-section">
                        <h1>Buat LinkTree <span style="background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;background-clip:text;color:transparent;">Gratis!</span></h1>
                        <p>Daftar sekarang dan buat halaman link personalmu sendiri.<br>Custom semua link sosial media, Spotify playlist, dan tampilan.</p>
                        <div class="cta-buttons">
                            <button id="openLoginBtn" class="btn-primary">Login</button>
                            <button id="openRegisterBtn" class="btn-outline">Daftar Gratis</button>
                        </div>
                        <div style="margin-top: 50px;">
                            <p style="opacity:0.6;">✨ Lebih dari 100+ user sudah bergabung ✨</p>
                        </div>
                    </div>
                `;
                navLinks.innerHTML = `<button id="navLoginBtn" class="btn-primary">Login</button>`;
                
                document.getElementById('openLoginBtn')?.addEventListener('click', () => openModal('login'));
                document.getElementById('openRegisterBtn')?.addEventListener('click', () => openModal('register'));
                document.getElementById('navLoginBtn')?.addEventListener('click', () => openModal('login'));
            } else {
                // Dashboard user
                const previewHtml = renderLinkTreePreview(currentUser);
                const settingsHtml = renderUserSettings();
                const adminHtml = renderAdminPanel();
                
                mainContainer.innerHTML = `
                    <div class="dashboard">
                        ${settingsHtml}
                        <div class="preview-section">
                            <div class="preview-container">
                                <div class="preview-header" style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                                    <h3><i class="fas fa-eye"></i> Live Preview</h3>
                                    <button id="viewMyLinktreeBtn" class="btn-outline" style="padding: 5px 15px;"><i class="fas fa-external-link-alt"></i> Lihat LinkTree Saya</button>
                                </div>
                                <div id="linktreePreview" class="linktree-preview">
                                    ${previewHtml}
                                </div>
                            </div>
                            ${currentUser.isAdmin ? `<div style="margin-top: 20px;">${adminHtml}</div>` : ''}
                        </div>
                    </div>
                `;
                
                navLinks.innerHTML = `
                    <span style="opacity:0.7;">👋 ${escapeHtml(currentUser.displayName || currentUser.username)}</span>
                    ${currentUser.isAdmin ? '<span style="background:rgba(255,0,0,0.3); padding:4px 12px; border-radius:20px; font-size:12px;">Admin</span>' : ''}
                    <button id="logoutBtn" class="btn-outline">Logout</button>
                `;
                
                // Bind form events
                bindFormEvents();
                
                document.getElementById('logoutBtn')?.addEventListener('click', logout);
                document.getElementById('viewMyLinktreeBtn')?.addEventListener('click', () => {
                    const fullHtml = generateFullHTML(currentUser);
                    const blob = new Blob([fullHtml], {type: 'text/html'});
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                });
                
                // Admin actions
                document.querySelectorAll('.view-user-linktree')?.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const userId = btn.dataset.userId;
                        const user = users.find(u => u.id === userId);
                        if(user) {
                            const fullHtml = generateFullHTML(user);
                            const blob = new Blob([fullHtml], {type: 'text/html'});
                            const url = URL.createObjectURL(blob);
                            window.open(url, '_blank');
                        }
                    });
                });
                document.querySelectorAll('.delete-user')?.forEach(btn => {
                    btn.addEventListener('click', () => {
                        if(confirm('Hapus user ini?')) {
                            deleteUser(btn.dataset.userId);
                        }
                    });
                });
            }
        }

        // Generate full HTML for a user
        function generateFullHTML(user) {
            const bioArray = (user.bio || '').split(',').map(s => s.trim()).filter(s => s);
            const theme = user.theme || 'light';
            const bgImage = user.bgImage || '';
            
            let bgStyle = '';
            if(bgImage) {
                bgStyle = `background: url('${bgImage}') center/cover fixed no-repeat;`;
            } else {
                bgStyle = theme === 'dark' ? 'background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);' : 'background: linear-gradient(135deg, #667eea, #764ba2);';
            }

            let avatarHtml = '';
            if(user.avatar) {
                avatarHtml = `<img src="${user.avatar}" class="avatar-img">`;
            } else {
                avatarHtml = '<i class="fas fa-user-astronaut"></i>';
            }

            let linksHtml = '';
            const platforms = [
                { key: 'instagram', name: 'Instagram', icon: 'fab fa-instagram' },
                { key: 'tiktok', name: 'TikTok', icon: 'fab fa-tiktok' },
                { key: 'youtube', name: 'YouTube', icon: 'fab fa-youtube' },
                { key: 'github', name: 'GitHub', icon: 'fab fa-github' },
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp' },
                { key: 'discord', name: 'Discord', icon: 'fab fa-discord' }
            ];

            platforms.forEach(p => {
                const url = user.links?.[p.key];
                const backText = user.backTexts?.[p.key] || '';
                if(url && url.trim()) {
                    linksHtml += `
            <a href="${url}" target="_blank" class="link-card">
                <div class="flip-card-inner">
                    <div class="card-front">
                        <div class="link-left"><i class="${p.icon}"></i><span>${p.name}</span></div>
                        <i class="fas fa-arrow-right"></i>
                    </div>
                    <div class="card-back">
                        <i class="${p.icon}"></i>
                        <span>${backText}</span>
                        <i class="fas fa-external-link-alt"></i>
                    </div>
                </div>
            </a>`;
                }
            });

            if(user.customLinks) {
                user.customLinks.forEach(link => {
                    if(link.name && link.url) {
                        linksHtml += `
            <a href="${link.url}" target="_blank" class="link-card">
                <div class="flip-card-inner">
                    <div class="card-front">
                        <div class="link-left"><i class="fas fa-link"></i><span>${link.name}</span></div>
                        <i class="fas fa-arrow-right"></i>
                    </div>
                    <div class="card-back">
                        <i class="fas fa-link"></i>
                        <span>${link.name}</span>
                        <i class="fas fa-external-link-alt"></i>
                    </div>
                </div>
            </a>`;
                    }
                });
            }

            let spotifyHtml = '';
            if(user.spotifyId && user.spotifyId.trim()) {
                let spotifyId = user.spotifyId.trim();
                if(spotifyId.includes('open.spotify.com')) {
                    const match = spotifyId.match(/playlist\/([a-zA-Z0-9]+)/);
                    if(match) spotifyId = match[1];
                }
                spotifyHtml = `
        <div class="spotify-player">
            <iframe src="https://open.spotify.com/embed/playlist/${spotifyId}?utm_source=generator" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>`;
            }

            return `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkTree - ${user.displayName || user.username}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            ${bgStyle}
            color: #fff;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .avatar-container {
            width: 120px; height: 120px; margin: 0 auto 20px;
            border-radius: 50%; overflow: hidden;
            border: 4px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 60px; color: white; }
        .profile h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
        .bio { text-align: center; font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
        .link-card {
            display: block;
            width: 100%;
            height: 70px;
            perspective: 1000px;
            margin-bottom: 15px;
            text-decoration: none;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 50px;
        }
        .link-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #1DB954, #191414);
            justify-content: center;
            gap: 12px;
        }
        .link-left { display: flex; align-items: center; gap: 15px; }
        .link-left i { font-size: 24px; width: 30px; }
        .spotify-player { margin: 20px 0; }
        .spotify-player iframe { border-radius: 12px; width: 100%; height: 152px; }
        .footer { text-align: center; font-size: 12px; opacity: 0.6; padding-top: 20px; }
        @media (max-width: 480px) {
            .link-card { height: 65px; }
            .card-front, .card-back { padding: 14px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar-container">
                ${avatarHtml}
            </div>
            <h1>${user.displayName || '@' + user.username}</h1>
            <div class="bio">${bioArray[0] || ''}</div>
        </div>
        ${linksHtml}
        ${spotifyHtml}
        <div class="footer">
            <p>© 2026 ${user.displayName || user.username} - Made with LinkTree Generator</p>
        </div>
    </div>
</body>
</html>`;
        }

        // Bind form events untuk user settings
        function bindFormEvents() {
            // Avatar upload
            const avatarPreview = document.getElementById('avatarPreviewUpload');
            const avatarInput = document.getElementById('avatarUploadInput');
            if(avatarPreview) {
                avatarPreview.addEventListener('click', () => avatarInput.click());
            }
            if(avatarInput) {
                avatarInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if(file && file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            updateUserData({ avatar: event.target.result });
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
            
            document.getElementById('clearAvatarBtn')?.addEventListener('click', () => {
                updateUserData({ avatar: null });
            });
            
            document.getElementById('saveSettingsBtn')?.addEventListener('click', () => {
                const customLinks = [];
                document.querySelectorAll('[data-custom-name]').forEach(input => {
                    const idx = parseInt(input.dataset.customName);
                    const urlInput = document.querySelector(`[data-custom-url="${idx}"]`);
                    if(input.value.trim() && urlInput?.value.trim()) {
                        customLinks.push({ name: input.value.trim(), url: urlInput.value.trim() });
                    }
                });
                
                updateUserData({
                    displayName: document.getElementById('displayName')?.value || '',
                    bio: document.getElementById('bio')?.value || '',
                    links: {
                        instagram: document.getElementById('instagramUrl')?.value || '',
                        tiktok: document.getElementById('tiktokUrl')?.value || '',
                        youtube: document.getElementById('youtubeUrl')?.value || '',
                        github: document.getElementById('githubUrl')?.value || '',
                        whatsapp: document.getElementById('whatsappUrl')?.value || '',
                        discord: document.getElementById('discordUrl')?.value || ''
                    },
                    backTexts: {
                        instagram: document.getElementById('backInstagram')?.value || '',
                        tiktok: document.getElementById('backTiktok')?.value || '',
                        youtube: document.getElementById('backYoutube')?.value || '',
                        github: document.getElementById('backGithub')?.value || ''
                    },
                    customLinks: customLinks,
                    spotifyId: document.getElementById('spotifyId')?.value || '',
                    theme: document.getElementById('themeMode')?.value || 'light',
                    bgImage: document.getElementById('bgImage')?.value || ''
                });
            });
            
            document.getElementById('addCustomLinkBtn')?.addEventListener('click', () => {
                const newCustomLinks = [...(currentUser.customLinks || []), { name: '', url: '' }];
                updateUserData({ customLinks: newCustomLinks });
            });
            
            document.querySelectorAll('[data-custom-remove]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.customRemove);
                    const newCustomLinks = [...(currentUser.customLinks || [])];
                    newCustomLinks.splice(idx, 1);
                    updateUserData({ customLinks: newCustomLinks });
                });
            });
        }

        // Modal handling
        function openModal(type) {
            if(type === 'login') {
                document.getElementById('loginModal').classList.add('show');
            } else {
                document.getElementById('registerModal').classList.add('show');
            }
        }

        function closeModals() {
            document.getElementById('loginModal')?.classList.remove('show');
            document.getElementById('registerModal')?.classList.remove('show');
        }

        document.getElementById('doLoginBtn')?.addEventListener('click', () => {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            if(login(username, password)) {
                closeModals();
            } else {
                alert('Username atau password salah!');
            }
        });

        document.getElementById('doRegisterBtn')?.addEventListener('click', () => {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const displayName = document.getElementById('regDisplayName').value;
            if(!username || !password) {
                alert('Username dan password harus diisi!');
                return;
            }
            if(register(username, password, displayName)) {
                alert('Pendaftaran berhasil! Silakan login.');
                closeModals();
                document.getElementById('loginUsername').value = username;
                openModal('login');
            } else {
                alert('Username sudah digunakan!');
            }
        });

        document.getElementById('showRegisterBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            closeModals();
            openModal('register');
        });

        document.getElementById('showLoginFromRegBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            closeModals();
            openModal('login');
        });

        // Initialize
        loadData();
        renderApp();
    </script>
</body>
</html>
