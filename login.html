<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LinkTree XTXZ | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase MILIK TUAN PUTRA
        const firebaseConfig = {
            apiKey: "AIzaSyD10-8FaZa_gO_2-QBs0HLvpqWEIjC30oE",
            authDomain: "linktree-xtxz.firebaseapp.com",
            databaseURL: "https://linktree-xtxz-default-rtdb.firebaseio.com",
            projectId: "linktree-xtxz",
            storageBucket: "linktree-xtxz.firebasestorage.app",
            messagingSenderId: "551602488147",
            appId: "1:551602488147:web:b8b0105b9b5ef90188d7a6",
            measurementId: "G-YPD0JGNEMB"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Export untuk digunakan di inline script
        window.auth = auth;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.sendPasswordResetEmail = sendPasswordResetEmail;
        window.signInWithPopup = signInWithPopup;
        window.googleProvider = googleProvider;
        
        console.log("✅ Firebase Connected - Project: linktree-xtxz");
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Background Orbs - Stabil */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #667eea;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #764ba2;
            bottom: -150px;
            right: -150px;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: #f093fb;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 40px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo-icon i {
            font-size: 32px;
            color: white;
        }

        .logo h2 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
        }

        .toggle-buttons {
            display: flex;
            gap: 12px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 28px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .form {
            display: none;
        }

        .form.active-form {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 15px 16px 15px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 28px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
            background: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            z-index: 2;
            background: white;
            padding-left: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -5px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-link {
            text-align: right;
            margin-top: 10px;
        }

        .forgot-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
        }

        .google-btn {
            width: 100%;
            padding: 13px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 28px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 0 0;
            transition: all 0.2s;
        }

        .google-btn:hover {
            border-color: #667eea;
            background: #f8fafc;
        }

        .divider {
            text-align: center;
            position: relative;
            margin: 22px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            background: white;
            padding: 0 16px;
            position: relative;
            color: #94a3b8;
            font-size: 12px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            font-weight: 500;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            max-width: 380px;
            width: 90%;
            padding: 32px;
            border-radius: 32px;
            text-align: center;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 22px;
            color: #94a3b8;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 22px;
            }
            .toggle-btn {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">
    <div class="glass-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-link"></i>
            </div>
            <h2>LinkTree XTXZ</h2>
            <p>Secure • Firebase Auth • Premium</p>
        </div>

        <div class="toggle-buttons">
            <button class="toggle-btn active" id="btnLogin" onclick="switchForm('login')">Login</button>
            <button class="toggle-btn" id="btnRegister" onclick="switchForm('register')">Register</button>
        </div>

        <div id="alert" class="alert"></div>

        <!-- LOGIN FORM -->
        <div id="loginForm" class="form active-form">
            <form id="loginFormElement" onsubmit="event.preventDefault(); handleLogin()">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                </div>
                <div class="forgot-link">
                    <a href="#" onclick="openResetModal()">Lupa Password?</a>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Login</button>
            </form>
            <div class="divider"><span>Atau</span></div>
            <button class="google-btn" onclick="handleGoogleLogin()">
                <i class="fab fa-google"></i> Login dengan Google
            </button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" class="form">
            <form id="registerFormElement" onsubmit="event.preventDefault(); handleRegister()">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regUsername" placeholder="Username" autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Email Address" autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword')"></i>
                </div>
                <button type="submit" class="submit-btn" id="registerBtn">Daftar Sekarang</button>
            </form>
            <div class="divider"><span>Atau</span></div>
            <button class="google-btn" onclick="handleGoogleLogin()">
                <i class="fab fa-google"></i> Daftar dengan Google
            </button>
        </div>
    </div>
</div>

<!-- RESET PASSWORD MODAL -->
<div id="resetModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeResetModal()">&times;</span>
        <i class="fas fa-key" style="font-size: 40px; color: #667eea; margin-bottom: 16px;"></i>
        <h3 style="margin-bottom: 16px;">Reset Password</h3>
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="resetEmail" placeholder="Email Anda" style="padding-left: 48px;">
        </div>
        <button class="submit-btn" id="resetBtn" onclick="handleResetPassword()">Kirim Link Reset</button>
        <p style="font-size: 11px; color: #64748b; margin-top: 16px;">Kami akan mengirim email reset password</p>
    </div>
</div>

<script type="module">
    // Import Firebase functions from window
    let auth = window.auth;
    let createUserWithEmailAndPassword = window.createUserWithEmailAndPassword;
    let signInWithEmailAndPassword = window.signInWithEmailAndPassword;
    let sendPasswordResetEmail = window.sendPasswordResetEmail;
    let signInWithPopup = window.signInWithPopup;
    let googleProvider = window.googleProvider;

    console.log("🚀 Firebase siap digunakan! Project: linktree-xtxz");

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.className = `alert ${type}`;
        alertDiv.innerHTML = message;
        alertDiv.style.display = 'block';
        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 3500);
    }

    function setLoading(buttonId, isLoading) {
        const btn = document.getElementById(buttonId);
        if (isLoading) {
            btn.innerHTML = '<span class="spinner"></span> Memproses...';
            btn.disabled = true;
        } else {
            if (buttonId === 'loginBtn') btn.innerHTML = 'Login';
            if (buttonId === 'registerBtn') btn.innerHTML = 'Daftar Sekarang';
            if (buttonId === 'resetBtn') btn.innerHTML = 'Kirim Link Reset';
            btn.disabled = false;
        }
    }

    window.togglePassword = function(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    window.switchForm = function(form) {
        const loginFormDiv = document.getElementById('loginForm');
        const registerFormDiv = document.getElementById('registerForm');
        const loginBtn = document.getElementById('btnLogin');
        const registerBtn = document.getElementById('btnRegister');
        
        if (form === 'login') {
            loginFormDiv.classList.add('active-form');
            registerFormDiv.classList.remove('active-form');
            loginBtn.classList.add('active');
            registerBtn.classList.remove('active');
        } else {
            loginFormDiv.classList.remove('active-form');
            registerFormDiv.classList.add('active-form');
            loginBtn.classList.remove('active');
            registerBtn.classList.add('active');
        }
        document.getElementById('alert').style.display = 'none';
    }

    window.handleRegister = async function() {
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!username) {
            showAlert('Username tidak boleh kosong!', 'error');
            return;
        }
        if (username.length < 3) {
            showAlert('Username minimal 3 karakter', 'error');
            return;
        }
        if (!email) {
            showAlert('Email tidak boleh kosong!', 'error');
            return;
        }
        if (!password) {
            showAlert('Password tidak boleh kosong!', 'error');
            return;
        }
        if (password.length < 6) {
            showAlert('Password minimal 6 karakter', 'error');
            return;
        }

        setLoading('registerBtn', true);

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            localStorage.setItem('linktree_username', username);
            
            showAlert('Registrasi berhasil! Silakan login.', 'success');
            
            document.getElementById('regUsername').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            
            setTimeout(() => switchForm('login'), 1500);
        } catch (error) {
            let errorMessage = 'Registrasi gagal! ';
            if (error.code === 'auth/email-already-in-use') {
                errorMessage = 'Email sudah terdaftar!';
            } else if (error.code === 'auth/invalid-email') {
                errorMessage = 'Email tidak valid!';
            } else if (error.code === 'auth/weak-password') {
                errorMessage = 'Password terlalu lemah!';
            } else {
                errorMessage += error.message;
            }
            showAlert(errorMessage, 'error');
        } finally {
            setLoading('registerBtn', false);
        }
    }

    window.handleLogin = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email) {
            showAlert('Email tidak boleh kosong!', 'error');
            return;
        }
        if (!password) {
            showAlert('Password tidak boleh kosong!', 'error');
            return;
        }

        setLoading('loginBtn', true);

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            const savedUsername = localStorage.getItem('linktree_username') || user.email.split('@')[0];
            localStorage.setItem('linktree_session', JSON.stringify({
                uid: user.uid,
                email: user.email,
                username: savedUsername,
                loginTime: new Date().toISOString()
            }));
            
            showAlert('Login berhasil! Redirecting...', 'success');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        } catch (error) {
            let errorMessage = 'Login gagal! ';
            if (error.code === 'auth/user-not-found') {
                errorMessage = 'Email tidak terdaftar!';
            } else if (error.code === 'auth/wrong-password') {
                errorMessage = 'Password salah!';
            } else if (error.code === 'auth/invalid-email') {
                errorMessage = 'Email tidak valid!';
            } else if (error.code === 'auth/too-many-requests') {
                errorMessage = 'Terlalu banyak percobaan. Coba lagi nanti.';
            } else {
                errorMessage += error.message;
            }
            showAlert(errorMessage, 'error');
        } finally {
            setLoading('loginBtn', false);
        }
    }

    window.handleGoogleLogin = async function() {
        setLoading('loginBtn', true);
        
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const user = result.user;
            const googleUsername = user.displayName || user.email.split('@')[0];
            
            localStorage.setItem('linktree_username', googleUsername);
            localStorage.setItem('linktree_session', JSON.stringify({
                uid: user.uid,
                email: user.email,
                username: googleUsername,
                provider: 'google',
                loginTime: new Date().toISOString()
            }));
            
            showAlert('Login dengan Google berhasil! Redirecting...', 'success');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        } catch (error) {
            showAlert('Google login gagal: ' + error.message, 'error');
        } finally {
            setLoading('loginBtn', false);
        }
    }

    window.openResetModal = function() {
        document.getElementById('resetModal').style.display = 'flex';
    }
    
    window.closeResetModal = function() {
        document.getElementById('resetModal').style.display = 'none';
    }
    
    window.handleResetPassword = async function() {
        const email = document.getElementById('resetEmail').value.trim();
        
        if (!email) {
            showAlert('Masukkan email Anda!', 'error');
            return;
        }
        
        setLoading('resetBtn', true);
        
        try {
            await sendPasswordResetEmail(auth, email);
            showAlert('Link reset password telah dikirim ke email Anda!', 'success');
            closeResetModal();
            document.getElementById('resetEmail').value = '';
        } catch (error) {
            let errorMessage = '';
            if (error.code === 'auth/user-not-found') {
                errorMessage = 'Email tidak terdaftar!';
            } else if (error.code === 'auth/invalid-email') {
                errorMessage = 'Email tidak valid!';
            } else {
                errorMessage = error.message;
            }
            showAlert(errorMessage, 'error');
        } finally {
            setLoading('resetBtn', false);
        }
    }

    window.onclick = function(event) {
        const modal = document.getElementById('resetModal');
        if (event.target === modal) {
            closeResetModal();
        }
    }

    // Cek session
    const existingSession = localStorage.getItem('linktree_session');
    if (existingSession && auth.currentUser) {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
