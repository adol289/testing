<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AuthPlus | Login & Register with OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification, applyActionCode, checkActionCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAbTdGLZaXvyLFAzGlzPpHi8IGL1SnPCNI",
            authDomain: "login-page-b2ab9.firebaseapp.com",
            databaseURL: "https://login-page-b2ab9-default-rtdb.firebaseio.com",
            projectId: "login-page-b2ab9",
            storageBucket: "login-page-b2ab9.firebasestorage.app",
            messagingSenderId: "136262198916",
            appId: "1:136262198916:web:82ee7cd9ba575d0deb84d1",
            measurementId: "G-84VL5MFC0N"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        window.auth = auth;
        window.database = database;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.sendPasswordResetEmail = sendPasswordResetEmail;
        window.sendEmailVerification = sendEmailVerification;
        window.ref = ref;
        window.set = set;
        window.get = get;
    </script>

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Particles Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 32px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(102,126,234,0); }
        }

        .logo-icon i {
            font-size: 32px;
            color: white;
        }

        .logo h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a0aec0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-top: 8px;
        }

        /* Toggle Buttons */
        .toggle-buttons {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.1);
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 32px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255,255,255,0.7);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        /* Forms */
        .form {
            display: none;
            animation: slideUp 0.4s ease;
        }

        .form.active-form {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 18px;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 15px 16px 15px 48px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 28px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255,255,255,0.12);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            z-index: 2;
        }

        /* Buttons */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-link {
            text-align: right;
            margin-top: 12px;
        }

        .forgot-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            font-weight: 500;
        }

        .alert.success {
            background: rgba(16,185,129,0.2);
            color: #10b981;
            border-left: 3px solid #10b981;
        }

        .alert.error {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            border-left: 3px solid #ef4444;
        }

        .alert.info {
            background: rgba(59,130,246,0.2);
            color: #3b82f6;
            border-left: 3px solid #3b82f6;
        }

        /* OTP Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
            padding: 32px;
            border-radius: 32px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            color: white;
            margin-bottom: 16px;
        }

        .modal-content p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .otp-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .otp-inputs input {
            width: 55px;
            height: 65px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .otp-inputs input:focus {
            outline: none;
            border-color: #667eea;
        }

        .resend-link {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .resend-link a {
            color: #667eea;
            cursor: pointer;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 22px;
            }
            .otp-inputs input {
                width: 45px;
                height: 55px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div class="container">
    <div class="glass-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h2>AuthPlus</h2>
            <p>Secure • OTP Verification • Premium</p>
        </div>

        <div class="toggle-buttons">
            <button class="toggle-btn active" onclick="switchForm('login')">Login</button>
            <button class="toggle-btn" onclick="switchForm('register')">Register</button>
        </div>

        <div id="alert" class="alert"></div>

        <!-- LOGIN FORM -->
        <div id="loginForm" class="form active-form">
            <form onsubmit="event.preventDefault(); handleLogin()">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                </div>
                <div class="forgot-link">
                    <a href="#" onclick="openResetOTPModal()">Lupa Password?</a>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Login</button>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" class="form">
            <form onsubmit="event.preventDefault(); handleRegister()">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regUsername" placeholder="Username" autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Email Address" autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword')"></i>
                </div>
                <button type="submit" class="submit-btn" id="registerBtn">Daftar Sekarang</button>
            </form>
        </div>
    </div>
</div>

<!-- OTP VERIFICATION MODAL -->
<div id="otpModal" class="modal">
    <div class="modal-content">
        <h3 id="otpModalTitle">Verifikasi Email</h3>
        <p id="otpModalDesc">Kami telah mengirim kode OTP ke <strong id="otpEmailDisplay"></strong></p>
        <div class="otp-inputs">
            <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 0)">
            <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 1)">
            <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 2)">
            <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 3)">
            <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 4)">
            <input type="text" maxlength="1" class="otp-digit" oninput="moveToNext(this, 5)">
        </div>
        <button class="submit-btn" id="verifyOtpBtn" onclick="verifyOTP()">Verifikasi</button>
        <div class="resend-link">
            Tidak menerima kode? <a onclick="resendOTP()">Kirim Ulang</a>
        </div>
    </div>
</div>

<!-- RESET PASSWORD OTP MODAL -->
<div id="resetOtpModal" class="modal">
    <div class="modal-content">
        <h3>Reset Password</h3>
        <p>Masukkan email Anda untuk menerima kode OTP reset password</p>
        <div class="input-group" style="margin-bottom: 20px;">
            <i class="fas fa-envelope"></i>
            <input type="email" id="resetEmailInput" placeholder="Email Address" style="padding-left: 48px;">
        </div>
        <button class="submit-btn" onclick="sendResetOTP()">Kirim Kode OTP</button>
    </div>
</div>

<!-- CONFIRM RESET PASSWORD MODAL -->
<div id="confirmResetModal" class="modal">
    <div class="modal-content">
        <h3>Reset Password</h3>
        <p>Masukkan kode OTP dan password baru Anda</p>
        <div class="otp-inputs">
            <input type="text" maxlength="1" class="reset-otp-digit" oninput="moveToNextReset(this, 0)">
            <input type="text" maxlength="1" class="reset-otp-digit" oninput="moveToNextReset(this, 1)">
            <input type="text" maxlength="1" class="reset-otp-digit" oninput="moveToNextReset(this, 2)">
            <input type="text" maxlength="1" class="reset-otp-digit" oninput="moveToNextReset(this, 3)">
            <input type="text" maxlength="1" class="reset-otp-digit" oninput="moveToNextReset(this, 4)">
            <input type="text" maxlength="1" class="reset-otp-digit" oninput="moveToNextReset(this, 5)">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="newPassword" placeholder="Password Baru" style="padding-left: 48px;">
        </div>
        <button class="submit-btn" onclick="confirmResetPassword()">Reset Password</button>
    </div>
</div>

<script>
    // ============ PARTICLES.JS CONFIG ============
    particlesJS("particles-js", {
        particles: {
            number: { value: 80, density: { enable: true, value_area: 800 } },
            color: { value: "#667eea" },
            shape: { type: "circle" },
            opacity: { value: 0.5, random: true },
            size: { value: 3, random: true },
            line_linked: { enable: true, distance: 150, color: "#764ba2", opacity: 0.2, width: 1 },
            move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
        },
        interactivity: {
            detect_on: "canvas",
            events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" } }
        },
        retina_detect: true
    });

    // ============ VARIABLES ============
    let auth = window.auth;
    let database = window.database;
    let createUserWithEmailAndPassword = window.createUserWithEmailAndPassword;
    let signInWithEmailAndPassword = window.signInWithEmailAndPassword;
    let sendPasswordResetEmail = window.sendPasswordResetEmail;
    let sendEmailVerification = window.sendEmailVerification;
    let ref = window.ref;
    let set = window.set;
    let get = window.get;

    let pendingUserData = null;
    let generatedOTP = null;
    let pendingResetEmail = null;

    // ============ HELPER FUNCTIONS ============
    function showAlert(message, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.className = `alert ${type}`;
        alertDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
        alertDiv.style.display = 'block';
        setTimeout(() => alertDiv.style.display = 'none', 4000);
    }

    function setLoading(buttonId, isLoading) {
        const btn = document.getElementById(buttonId);
        if (isLoading) {
            btn.innerHTML = '<span class="spinner"></span> Memproses...';
            btn.disabled = true;
        } else {
            if (buttonId === 'loginBtn') btn.innerHTML = 'Login';
            if (buttonId === 'registerBtn') btn.innerHTML = 'Daftar Sekarang';
            btn.disabled = false;
        }
    }

    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function switchForm(form) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const btns = document.querySelectorAll('.toggle-btn');
        
        if (form === 'login') {
            loginForm.classList.add('active-form');
            registerForm.classList.remove('active-form');
            btns[0].classList.add('active');
            btns[1].classList.remove('active');
        } else {
            loginForm.classList.remove('active-form');
            registerForm.classList.add('active-form');
            btns[0].classList.remove('active');
            btns[1].classList.add('active');
        }
        document.getElementById('alert').style.display = 'none';
    }

    // Generate OTP 6 digit
    function generateOTP() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }

    // Kirim email OTP (simulasi dengan console & alert)
    function sendOTPEmail(email, otp, type = 'verification') {
        console.log(`📧 [EMAIL SIMULATION] To: ${email}`);
        console.log(`📧 [${type.toUpperCase()} OTP] Your code is: ${otp}`);
        showAlert(`Kode OTP: ${otp} (cek console browser)`, 'info');
        return true;
    }

    // ============ REGISTER WITH OTP ============
    async function handleRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!username || username.length < 3) {
            showAlert('Username minimal 3 karakter!', 'error');
            return;
        }
        if (!email) {
            showAlert('Email tidak boleh kosong!', 'error');
            return;
        }
        if (!password || password.length < 6) {
            showAlert('Password minimal 6 karakter!', 'error');
            return;
        }

        setLoading('registerBtn', true);
        
        try {
            // Cek apakah email sudah terdaftar
            // Simpan data sementara
            pendingUserData = { username, email, password };
            
            // Generate dan kirim OTP
            generatedOTP = generateOTP();
            sendOTPEmail(email, generatedOTP, 'verification');
            
            // Tampilkan modal OTP
            document.getElementById('otpModalTitle').innerText = 'Verifikasi Email';
            document.getElementById('otpModalDesc').innerHTML = `Kami telah mengirim kode OTP ke <strong>${email}</strong>`;
            document.getElementById('otpEmailDisplay').innerText = email;
            document.getElementById('otpModal').style.display = 'flex';
            
            // Reset OTP inputs
            document.querySelectorAll('.otp-digit').forEach((input, idx) => {
                input.value = '';
                if(idx === 0) input.focus();
            });
        } catch (error) {
            showAlert('Gagal mengirim OTP: ' + error.message, 'error');
        } finally {
            setLoading('registerBtn', false);
        }
    }

    async function verifyOTP() {
        let enteredOTP = '';
        document.querySelectorAll('.otp-digit').forEach(input => {
            enteredOTP += input.value;
        });
        
        if (enteredOTP.length !== 6) {
            showAlert('Masukkan 6 digit kode OTP!', 'error');
            return;
        }
        
        if (enteredOTP !== generatedOTP) {
            showAlert('Kode OTP salah!', 'error');
            return;
        }
        
        // OTP benar, lanjutkan registrasi ke Firebase
        document.getElementById('verifyOtpBtn').innerHTML = '<span class="spinner"></span> Memverifikasi...';
        document.getElementById('verifyOtpBtn').disabled = true;
        
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, pendingUserData.email, pendingUserData.password);
            const user = userCredential.user;
            
            // Simpan username ke database
            await set(ref(database, `users/${user.uid}`), {
                username: pendingUserData.username,
                email: pendingUserData.email,
                verified: true,
                createdAt: new Date().toISOString()
            });
            
            // Kirim email verifikasi Firebase (opsional)
            await sendEmailVerification(user);
            
            showAlert('Registrasi berhasil! Silakan login.', 'success');
            closeOTPModal();
            
            // Clear form
            document.getElementById('regUsername').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            
            pendingUserData = null;
            generatedOTP = null;
            
            setTimeout(() => switchForm('login'), 1500);
        } catch (error) {
            let errorMsg = 'Registrasi gagal! ';
            if (error.code === 'auth/email-already-in-use') {
                errorMsg = 'Email sudah terdaftar!';
            } else if (error.code === 'auth/invalid-email') {
                errorMsg = 'Email tidak valid!';
            } else {
                errorMsg += error.message;
            }
            showAlert(errorMsg, 'error');
        } finally {
            document.getElementById('verifyOtpBtn').innerHTML = 'Verifikasi';
            document.getElementById('verifyOtpBtn').disabled = false;
        }
    }

    function resendOTP() {
        if (pendingUserData && pendingUserData.email) {
            generatedOTP = generateOTP();
            sendOTPEmail(pendingUserData.email, generatedOTP, 'verification');
            showAlert('Kode OTP baru telah dikirim!', 'success');
        }
    }

    function closeOTPModal() {
        document.getElementById('otpModal').style.display = 'none';
        pendingUserData = null;
        generatedOTP = null;
    }

    function moveToNext(input, index) {
        if (input.value.length === 1 && index < 5) {
            document.querySelectorAll('.otp-digit')[index + 1].focus();
        }
    }

    // ============ LOGIN ============
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showAlert('Email dan password wajib diisi!', 'error');
            return;
        }

        setLoading('loginBtn', true);
        
        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            // Ambil username dari database
            const snapshot = await get(ref(database, `users/${user.uid}`));
            let username = email.split('@')[0];
            if (snapshot.exists()) {
                username = snapshot.val().username;
            }
            
            localStorage.setItem('auth_session', JSON.stringify({
                uid: user.uid,
                email: user.email,
                username: username,
                loginTime: new Date().toISOString()
            }));
            
            showAlert(`Selamat datang, ${username}!`, 'success');
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        } catch (error) {
            let errorMsg = 'Login gagal! ';
            if (error.code === 'auth/user-not-found') {
                errorMsg = 'Email tidak terdaftar!';
            } else if (error.code === 'auth/wrong-password') {
                errorMsg = 'Password salah!';
            } else if (error.code === 'auth/invalid-email') {
                errorMsg = 'Email tidak valid!';
            } else {
                errorMsg += error.message;
            }
            showAlert(errorMsg, 'error');
        } finally {
            setLoading('loginBtn', false);
        }
    }

    // ============ RESET PASSWORD WITH OTP ============
    let resetOTP = null;
    
    function openResetOTPModal() {
        document.getElementById('resetOtpModal').style.display = 'flex';
        document.getElementById('resetEmailInput').value = '';
    }
    
    function closeResetOtpModal() {
        document.getElementById('resetOtpModal').style.display = 'none';
    }
    
    function sendResetOTP() {
        const email = document.getElementById('resetEmailInput').value.trim();
        
        if (!email) {
            showAlert('Masukkan email Anda!', 'error');
            return;
        }
        
        pendingResetEmail = email;
        resetOTP = generateOTP();
        sendOTPEmail(email, resetOTP, 'reset password');
        
        closeResetOtpModal();
        
        // Buka modal confirm reset
        document.getElementById('confirmResetModal').style.display = 'flex';
        document.querySelectorAll('.reset-otp-digit').forEach((input, idx) => {
            input.value = '';
            if(idx === 0) input.focus();
        });
        document.getElementById('newPassword').value = '';
    }
    
    function moveToNextReset(input, index) {
        if (input.value.length === 1 && index < 5) {
            document.querySelectorAll('.reset-otp-digit')[index + 1].focus();
        }
    }
    
    async function confirmResetPassword() {
        let enteredOTP = '';
        document.querySelectorAll('.reset-otp-digit').forEach(input => {
            enteredOTP += input.value;
        });
        
        const newPassword = document.getElementById('newPassword').value;
        
        if (enteredOTP.length !== 6) {
            showAlert('Masukkan 6 digit kode OTP!', 'error');
            return;
        }
        
        if (enteredOTP !== resetOTP) {
            showAlert('Kode OTP salah!', 'error');
            return;
        }
        
        if (!newPassword || newPassword.length < 6) {
            showAlert('Password baru minimal 6 karakter!', 'error');
            return;
        }
        
        try {
            await sendPasswordResetEmail(auth, pendingResetEmail);
            showAlert('Link reset password telah dikirim ke email Anda! Gunakan link tersebut untuk mengatur password baru.', 'success');
            closeConfirmResetModal();
            document.getElementById('resetEmailInput').value = '';
        } catch (error) {
            let errorMsg = '';
            if (error.code === 'auth/user-not-found') {
                errorMsg = 'Email tidak terdaftar!';
            } else {
                errorMsg = error.message;
            }
            showAlert(errorMsg, 'error');
        }
    }
    
    function closeConfirmResetModal() {
        document.getElementById('confirmResetModal').style.display = 'none';
        pendingResetEmail = null;
        resetOTP = null;
    }

    // Close modal on outside click
    window.onclick = function(event) {
        const otpModal = document.getElementById('otpModal');
        const resetOtpModal = document.getElementById('resetOtpModal');
        const confirmResetModal = document.getElementById('confirmResetModal');
        
        if (event.target === otpModal) closeOTPModal();
        if (event.target === resetOtpModal) closeResetOtpModal();
        if (event.target === confirmResetModal) closeConfirmResetModal();
    }
    
    // Expose functions
    window.switchForm = switchForm;
    window.togglePassword = togglePassword;
    window.handleLogin = handleLogin;
    window.handleRegister = handleRegister;
    window.verifyOTP = verifyOTP;
    window.resendOTP = resendOTP;
    window.openResetOTPModal = openResetOTPModal;
    window.sendResetOTP = sendResetOTP;
    window.confirmResetPassword = confirmResetPassword;
    window.moveToNext = moveToNext;
    window.moveToNextReset = moveToNextReset;
    window.closeOTPModal = closeOTPModal;
    window.closeConfirmResetModal = closeConfirmResetModal;
    window.closeResetOtpModal = closeResetOtpModal;
</script>
</body>
</html>
